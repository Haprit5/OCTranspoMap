function initSidebarToggle() {
  let stored = null;
  try { stored = localStorage.getItem("otm-sidebar"); } catch (e) { /* private mode */ }

  setSidebarOpen(stored !== "0");

  document.getElementById("sidebar-open").addEventListener("click", () => setSidebarOpen(true));
  document.getElementById("sidebar-close").addEventListener("click", () => setSidebarOpen(false));
}

/* Below LABEL_ZOOM only arterials and highways are named. Rebuilding the whole
   style array is the only way to change this at runtime, so only do it when
   the tier actually flips. */
function applyLabelTier() {
  const tier = map.getZoom() >= LABEL_ZOOM ? "full" : "sparse";
  if (tier === labelTier) return;
  labelTier = tier;
  applyStyles();
}

function drawLine(line) {
  const path = decodePath(line.path);

  // No dark casing: on a basemap this quiet the route reads perfectly well on
  // its own, and the casing was the heaviest ink on the map.
  const route = new google.maps.Polyline({
    path, map,
    strokeColor: line.color,
    strokeOpacity: 1,
    strokeWeight: routeWeight(false),
    zIndex: 2
  });

  // Dashed white overlay over the sections OSM tags as tunnel.
  const tunnels = (line.tunnelPaths || []).map(encoded => new google.maps.Polyline({
    path: decodePath(encoded),
    map,
    strokeOpacity: 0,
    zIndex: 3,
    icons: [{
      icon: {
        path: "M 0,-1 0,1",
        strokeColor: "#ffffff",
        strokeOpacity: 0.85,
        strokeWeight: 2.5,
        scale: 1.5
      },
      offset: "0",
      repeat: "11px"
    }]
  }));

  // The dashed overlays sit on top of the route, so they have to answer to the
  // same gestures — otherwise crossing one reads as leaving the line.
  [route, ...tunnels].forEach(shape => {
    shape.addListener("click", () => openLinePanel(line));
    if (!CAN_HOVER) return;
    shape.addListener("mouseover", () => route.setOptions({ strokeWeight: routeWeight(true) }));
    shape.addListener("mouseout", () => route.setOptions({ strokeWeight: routeWeight(false) }));
  });

  line.stations.forEach(station => {
    // A transfer station is drawn once, by whichever line reaches it first.
    const existing = stationIndex.find(e => e.station.name === station.name);
    if (existing) {
      existing.lines.push(line);
      return;
    }

    const marker = new google.maps.Marker({
      map,
      position: { lat: station.lat, lng: station.lng },
      // No `title`: the custom hover label replaces the native tooltip, and
      // having both means the same name twice, a second apart.
      icon: stationIcon(line, station, false),
      zIndex: station.transfer ? 20 : 10
    });

    const entry = { line, lines: [line], station, marker };
    stationIndex.push(entry);

    marker.addListener("click", () => openStation(entry));

    // Touch fires mouseover on tap but never mouseout, so the dot would stay
    // enlarged and the label stranded. Don't wire hover up at all there.
    if (CAN_HOVER) {
      marker.addListener("mouseover", () => {
        marker.setIcon(stationIcon(line, station, true));
        entry.labelEl?.classList.add("hot");
      });
      marker.addListener("mouseout", () => {
        marker.setIcon(stationIcon(line, station, false));
        entry.labelEl?.classList.remove("hot");
      });
    }
  });

  layers[line.id] = { route, tunnels, path, visible: true };
}

/* Names are drawn permanently beside every dot, so they're readable without a
   mouse — hover-only labels were invisible on a phone. Zooming out drops them
   by importance: minor stops go first, then stops with connections, and the
   interchanges and line ends last, alongside the dots themselves.

   One overlay owns all the labels rather than one overlay each: a single
   projection lookup per redraw, and one place to reposition from.

   Built after the Maps library has loaded, since it extends OverlayView, which
   doesn't exist when this file is first evaluated — hence a factory called
   from initMap rather than a top-level class declaration. It also has to run
   after drawLine, which is what fills stationIndex. */

const STOP_LABEL_ZOOM = {
  // Where the line ends is the one thing worth knowing on a zoomed-out map —
  // it's what a vehicle's destination header tells you. These arrive two steps
  // before anything else, below even DETAIL_MIN_ZOOM, so the far view is four
  // names on three lines and nothing else. Deliberately without dots, the way
  // a regional rail map just runs the line out to its name.
  terminus: 10,
  major: DETAIL_MIN_ZOOM,   // interchanges and stops with connections
  minor: 13,
  transit: 15,              // rapid-bus stops: late, so they never crowd rail names
  // Stage 2 arrives with the live network rather than two steps later. It
  // still ranks below every open station, so in a collision it's the future
  // name that yields — that's what keeps it out of the way, not the zoom.
  future: DETAIL_MIN_ZOOM
};

/* Ranking is separate from the zoom threshold because they answer different
   questions: the threshold decides when a name is eligible, the rank decides
   who wins when two eligible names overlap. Terminus first — it's the name on
   the front of the train, and the one you look for to tell which way a line
   runs. Without its own rank a terminus ties with every other stop at the same
   threshold and the tiebreak falls to alphabetical order, which is how
   "Airport" could lose its slot to a neighbour. */
function labelPriority(entry) {
  const { station, lines } = entry;
  const isTerminus = lines.some(l =>
    l.stations[0].name === station.name ||
    l.stations[l.stations.length - 1].name === station.name);

  // An interchange is where lines meet, not where the network ends. Bayview
  // and South Keys are technically line ends but sit in the middle of the map,
  // so naming them at far zoom would read as arbitrary — they wait their turn
  // with the other interchanges.
  if (isTerminus && !station.transfer) return 0;
  if (isTerminus || station.transfer) return 1;
  return station.conn ? 2 : 3;
}

function stopLabelZoom(entry) {
  const rank = labelPriority(entry);
  if (rank === 0) return STOP_LABEL_ZOOM.terminus;
  return rank <= 2 ? STOP_LABEL_ZOOM.major : STOP_LABEL_ZOOM.minor;
}

function initStationLabels() {
  class StationLabels extends google.maps.OverlayView {
    constructor() {
      super();
      this.container = document.createElement("div");
      this.container.className = "stop-labels";
      this.setMap(map);
    }

    onAdd() {
      /* markerLayer, not floatPane: the info window renders into floatPane, and
         a label from some other station was landing on top of the open bubble.
         Panes are stacked in a fixed order, so this puts every label below the
         bubble for good rather than depending on z-index luck. Labels are
         pointer-events: none anyway, so nothing is lost by sitting in a pane
         that doesn't receive mouse events. */
      this.getPanes().markerLayer.appendChild(this.container);

      // Open and Stage 2 stations share one overlay so they compete for space
      // in a single collision pass — two overlays would happily print a future
      // name straight through a live one.
      this.entries = stationIndex.concat(futureLabels, transitLabels);

      this.entries.forEach(entry => {
        const el = document.createElement("div");
        el.className = "stop-label" +
          (entry.isFuture ? " future" : entry.isTransit ? " transit" : "");
        el.textContent = stationName(entry.station);
        this.container.appendChild(el);

        entry.labelEl = el;
        entry.labelZoom = entry.isFuture  ? STOP_LABEL_ZOOM.future
                        : entry.isTransit ? STOP_LABEL_ZOOM.transit
                        : stopLabelZoom(entry);
        // Ranked last of all: a bus stop should never displace a train station.
        entry.labelRank = entry.isFuture ? 4 : entry.isTransit ? 5 : labelPriority(entry);
        entry.labelGap = entry.station.transfer ? 12 : 10;   // clear of the dot
        entry.labelAbove = !!entry.isFuture;                 // Stage 2 sits over its dot
        // Measured once, while everything is still visible. Reading offsetWidth
        // inside draw() would force a reflow on every pan frame, and the text
        // never changes anyway.
        entry.labelW = el.offsetWidth;
        entry.labelH = el.offsetHeight;
      });

      // Most important first, so that when two names collide it's the lesser
      // one that yields: termini, then interchanges, then stops with
      // connections, then the rest, and Stage 2 last of all — a station that
      // isn't open yet should never displace one that is. Name breaks ties,
      // to keep it stable.
      this.ordered = [...this.entries].sort((a, b) =>
        a.labelRank - b.labelRank ||
        a.labelZoom - b.labelZoom ||
        a.station.name.localeCompare(b.station.name));

      /* labelZoom only exists as of this line, and updateDetailVisibility has
         already run at least once without it — every `zoom >= entry.labelZoom`
         compared against undefined, came out false, and marked every name
         hidden. Recompute now that the entries are complete; the API calls
         draw() immediately after this, so the corrected flags are what it uses.

         Above DETAIL_MIN_ZOOM this was invisible, because `detailed` shows the
         names on its own. It only showed at the default view, where the four
         terminus names are the whole label layer and simply never appeared
         until something else triggered a recompute. */
      updateDetailVisibility();
    }

    onRemove() { this.container.remove(); }

    /* Places labels in importance order, skipping any that would overlap one
       already placed. Collisions depend only on relative pixel offsets, which
       depend only on zoom — so panning never makes a name flicker. */
    draw() {
      const projection = this.getProjection();
      if (!projection || !this.ordered) return;

      const zoom = map.getZoom();
      const placed = [];
      // A stop served by both rail and a bus corridor has an entry per layer.
      // Whichever is drawn first claims the name; the other stays silent so a
      // shared station reads once, no matter how many layers it belongs to.
      const named = new Set();

      // Stops of a framed line get first claim on the space, so a name from
      // some other line can't crowd out one the user is actually looking at.
      const order = this.ordered.filter(e => e.labelForced)
        .concat(this.ordered.filter(e => !e.labelForced));

      order.forEach(entry => {
        const el = entry.labelEl;

        if (!entry.labelShown || (!entry.labelForced && zoom < entry.labelZoom)) {
          el.style.display = "none";
          return;
        }

        const point = projection.fromLatLngToDivPixel(
          new google.maps.LatLng(entry.station.lat, entry.station.lng));
        if (!point) return;

        // Two placements: beside the dot for open stations, centred above it
        // for Stage 2. The collision box has to match wherever the label
        // actually lands, or names would be tested in one place and drawn in
        // another.
        const w = entry.labelW + 4;   // a little breathing room between names
        const h = entry.labelH + 2;
        const box = entry.labelAbove
          ? { x: point.x - w / 2, y: point.y - entry.labelGap - h, w, h }
          : { x: point.x + entry.labelGap, y: point.y - entry.labelH / 2, w, h };

        const clashes = named.has(entry.station.name) || placed.some(other =>
          box.x < other.x + other.w && other.x < box.x + box.w &&
          box.y < other.y + other.h && other.y < box.y + box.h);

        if (clashes) {
          el.style.display = "none";
          return;
        }

        named.add(entry.station.name);
        placed.push(box);
        el.style.display = "";
        el.style.transform = entry.labelAbove
          ? `translate(${point.x}px, ${point.y - entry.labelGap}px) translate(-50%, -100%)`
          : `translate(${box.x}px, ${point.y}px) translateY(-50%)`;
      });
    }
  }

  stationLabels = new StationLabels();
}

/* Stage 2 draws in the line's colour but hollow and half-lit, so it reads as
   "not yet" at a glance rather than needing a legend to decode. Kept in its
   own layer object: these stations never enter stationIndex, so they can't
   turn up in search results or as the nearest station to an address. */
function drawFuture() {
  FUTURE.forEach(project => {
    const shapes = [];

    if (project.path) {
      shapes.push(new google.maps.Polyline({
        path: decodePath(project.path),
        map: null,
        strokeOpacity: 0,
        zIndex: 1,
        icons: [{
          icon: {
            path: "M 0,-1 0,1",
            strokeColor: project.color,
            strokeOpacity: 0.75,
            strokeWeight: 4,
            scale: 1.4
          },
          offset: "0",
          repeat: "12px"
        }]
      }));
    }

    project.stations.forEach(station => {
      // A label entry, not a stationIndex entry — it gets a name on the map
      // without becoming searchable or counting as a nearest station.
      const entry = { station, project, isFuture: true };
      futureLabels.push(entry);

      const marker = new google.maps.Marker({
        map: null,
        position: { lat: station.lat, lng: station.lng },
        title: `${stationName(station)} — ${lineName(project)} (${t("underConstructionCard").toLowerCase()})`,
        zIndex: 5,
        icon: futureStationIcon(project, false)
      });

      // Same hover response as an open station: the dot grows and its name
      // lights up. Skipped on touch for the same reason as everywhere else —
      // mouseover fires on tap and mouseout never follows.
      if (CAN_HOVER) {
        marker.addListener("mouseover", () => {
          marker.setIcon(futureStationIcon(project, true));
          entry.labelEl?.classList.add("hot");
        });
        marker.addListener("mouseout", () => {
          marker.setIcon(futureStationIcon(project, false));
          entry.labelEl?.classList.remove("hot");
        });
      }

      shapes.push(marker);
    });

    futureShapes.push(...shapes);
  });
}

/* Deliberately understated: a neutral grey, thinner than the rail, and at
   zIndex 0 so every route draws over it. It's context for where the buses run,
   not a fourth network competing with the trains. */
function drawTransitway() {
  TRANSITWAY.forEach(corridor => {
    const shape = new google.maps.Polyline({
      path: decodePath(corridor.path),
      map: transitwayVisible ? map : null,
      strokeColor: palette().transitway,
      strokeOpacity: 0.85,
      strokeWeight: corridorWeight(false),
      zIndex: 0
    });

    // Same affordance the rail lines have: the corridor is clickable, so it
    // should answer the pointer. It grows proportionally more than a train
    // line does — 1.6 px is thin enough that the rail's +2.5 px would look
    // like a different layer rather than the same one under the cursor.
    if (CAN_HOVER) {
      shape.addListener("mouseover", () =>
        shape.setOptions({ strokeWeight: corridorWeight(true), strokeOpacity: 1 }));
      shape.addListener("mouseout", () =>
        shape.setOptions({ strokeWeight: corridorWeight(false), strokeOpacity: 0.85 }));
    }

    // Which buses use this stretch is the whole reason the corridor is drawn,
    // and it differs section by section — 3 routes on one, 31 on another — so
    // the answer belongs on the section you clicked, not in a global list.
    shape.addListener("click", e => {
      prepareInfoWindow();
      infoWindow.setContent(`
        <div class="iw">
          <h3>${t("rapidBusRoute")}</h3>
          <p class="conn">${corridor.routes.length
            ? t("servedByRoutes", corridor.routes.length)
            : t("routesUnavailable")}</p>
          <div class="routes">${routeChips(corridor.routes)}</div>
        </div>
      `);
      infoWindow.setPosition(e.latLng);
      infoWindow.open({ map });
    });

    transitwayShapes.push(shape);
  });

  TRANSIT_STATIONS.forEach(station => {
    // Label entry only — like Stage 2, these never join stationIndex, so they
    // stay out of search, line stats and nearest-station results.
    const entry = { station, isTransit: true };
    transitLabels.push(entry);

    const marker = new google.maps.Marker({
      map: transitwayVisible ? map : null,
      position: { lat: station.lat, lng: station.lng },
      title: `${stationName(station)} — ${t("rapidBusStation").toLowerCase()}`,
      zIndex: 4,          // under the rail dots, over the corridors
      icon: transitStationIcon(false)
    });
    entry.marker = marker;

    marker.addListener("click", () => openTransitStation(entry));

    if (CAN_HOVER) {
      marker.addListener("mouseover", () => {
        marker.setIcon(transitStationIcon(true));
        entry.labelEl?.classList.add("hot");
      });
      marker.addListener("mouseout", () => {
        marker.setIcon(transitStationIcon(false));
        entry.labelEl?.classList.remove("hot");
      });
    }

    transitwayShapes.push(marker);
  });
}

/* The bus counterpart to openStation, and separate from it because these
   stations carry different data: routes rather than lines, and none of the
   rail network's addresses, connections or accessibility facts.

   Reachable from the address panel as well as from the marker, so it can be
   asked to open a station whose marker is off the map — the layer toggled off,
   or the zoom below DETAIL_MIN_ZOOM. Anchoring to a hidden marker would put
   the bubble nowhere, hence the position fallback. */
function openTransitStation(entry) {
  const { station } = entry;
  const routes = stationRoutes(station);
  const position = { lat: station.lat, lng: station.lng };

  prepareInfoWindow();

  // Same as the rail popup: with an address pinned, directions start from it.
  const from = currentAddress
    ? `<p class="from">${t("from").toLowerCase()} ${escapeHtml(currentAddress.name)}</p>`
    : "";

  infoWindow.setContent(`
    <div class="iw">
      <h3>${escapeHtml(stationName(station))}</h3>
      <p class="conn">${t("rapidBusStation")}${routes.length
        ? ` &middot; ${t("servedByRoutes", routes.length)}` : ""}</p>
      ${routes.length ? `<div class="routes">${routeChips(routes)}</div>` : ""}
      ${from}
      <div class="links">
        <a href="${directionsUrl(station, "transit")}" target="_blank" rel="noopener">${t("transitDirections")}</a>
        <a href="${directionsUrl(station, "walking")}" target="_blank" rel="noopener">${t("walking")}</a>
        <a href="${mapsUrl(station)}" target="_blank" rel="noopener">${t("openInMaps")}</a>
      </div>
    </div>
  `);

  if (entry.marker && entry.marker.getMap()) {
    infoWindow.open({ map, anchor: entry.marker });
  } else {
    infoWindow.setPosition(position);
    infoWindow.open({ map });
  }

  // Matches openStation, and the panel row depends on it: the nearest rapid bus
  // station can easily be off screen when the row is clicked.
  map.panTo(position);
  if (map.getZoom() < 14) map.setZoom(14);
}

/* Same circle as a train stop but inverted — solid navy inside a white ring,
   where a station is a white centre inside a coloured ring. Reads as a
   different kind of stop without needing a different shape, and being centred
   on its coordinate rather than anchored at a tip makes it the more honest
   marker of the two. */
function transitStationIcon(hover) {
  return {
    path: google.maps.SymbolPath.CIRCLE,
    scale: hover ? 5 : 3.6,
    fillColor: palette().transitway,
    fillOpacity: 1,
    strokeColor: "#ffffff",
    strokeWeight: 1.6,
    strokeOpacity: 1
  };
}

/* Which routes call at a stop, from the OSM route relations that list it as a
   member. Keyed by name because that is what the marker carries; stations the
   data has nothing for simply show no chips rather than an empty box. */
function stationRoutes(station) {
  return STATION_ROUTES[station.name] || [];
}

/* OC Transpo's schedule page takes the route number and a date. The date is
   generated at click time rather than baked in: a hard-coded YYYYMMDD starts
   asking for a past day's timetable the morning after it's written, and this
   page has no build step to refresh it. */
function scheduleUrl(route) {
  const now = new Date();
  const stamp = String(now.getFullYear()) +
    String(now.getMonth() + 1).padStart(2, "0") +
    String(now.getDate()).padStart(2, "0");
  const base = lang === "fr"
    ? "https://www.octranspo.com/fr/planifiez-votre-trajet/horaires-plans/"
    : "https://www.octranspo.com/en/plan-your-trip/schedules-maps/";
  return base + "?" + new URLSearchParams({ "sched-lang": lang, date: stamp, rte: route });
}

/* One renderer for route numbers, used by the corridor popup, the station
   popup and the sidebar list — three places that were each about to grow their
   own copy of the same anchor. */
function routeChips(routes) {
  return routes.map(r =>
    `<a class="route" href="${scheduleUrl(r)}" target="_blank" rel="noopener"
        title="${escapeHtml(t("routeSchedule", r))}">${escapeHtml(r)}</a>`
  ).join("");
}

function setTransitwayVisible(visible) {
  transitwayVisible = visible;
  updateDetailVisibility();
  syncConnector(TRANSITWAY_LINE.id, visible);
}

function refreshTransitwayColour() {
  transitwayShapes.forEach(s => {
    if (s.setIcon) s.setIcon(transitStationIcon(false));       // station marker
    else s.setOptions({ strokeColor: palette().transitway });  // corridor
  });

  // The rail connectors are fixed line colours, but this one tracks the theme.
  const connector = connectors[TRANSITWAY_LINE.id];
  if (connector) connector.setOptions({ icons: connectorIcons(palette().transitway) });
}

/* Hollow and half-lit against the solid dots of the open network, and growing
   on hover by the same 1.3x the open ones use. */
function futureStationIcon(project, hover) {
  return {
    path: google.maps.SymbolPath.CIRCLE,
    scale: 4.5 * (hover ? 1.3 : 1),
    fillColor: palette().dotFill,
    fillOpacity: 0.55,
    strokeColor: project.color,
    strokeOpacity: hover ? 1 : 0.75,
    strokeWeight: 2
  };
}

/* Both of these just flip the flag — updateDetailVisibility owns what actually
   goes on the map, because visibility is now two questions at once: is the
   layer switched on, and are we zoomed in far enough for its stations. */
function setFutureVisible(visible) {
  futureVisible = visible;
  updateDetailVisibility();
}

/* Routes run heavier over imagery, which is busy enough to swallow a thin
   line, and heavier again while hovered. */
function routeWeight(hover) {
  const base = document.body.classList.contains("imagery") ? 6.5 : 5;
  return hover ? base + 2.5 : base;
}

/* The bus counterpart. Trains are 5 px and these are 1.6, so this deliberately
   isn't the same +2.5: on a line this thin that reads as a different layer
   appearing rather than the one under the cursor responding. Roughly doubling
   it says "this is clickable" without letting a context layer outweigh a
   route. Heavier over imagery for the same reason the rail is. */
function corridorWeight(hover) {
  const base = document.body.classList.contains("imagery") ? 2.2 : 1.6;
  return hover ? base + 1.8 : base;
}

/* Hollow dot for a regular stop, filled for a transfer — the same language the
   sidebar uses. Imagery gets a heavier ring so the dots don't sink into it. */
function stationIcon(line, station, hover) {
  const onImagery = document.body.classList.contains("imagery");
  const p = palette();
  const base = station.transfer ? 7 : 5.5;
  return {
    path: google.maps.SymbolPath.CIRCLE,
    scale: base * (hover ? 1.3 : 1),
    fillColor: station.transfer ? line.color : p.dotFill,
    fillOpacity: 1,
    strokeColor: station.transfer ? p.dotRing : line.color,
    strokeWeight: (station.transfer ? 2.5 : 3) + (onImagery ? 0.5 : 0),
    strokeOpacity: 1
  };
}

function addressIcon() {
  return {
    path: google.maps.SymbolPath.CIRCLE,
    scale: 7.5,
    fillColor: palette().accent,
    fillOpacity: 1,
    strokeColor: "#ffffff",
    strokeWeight: 3
  };
}

function refreshStationIcons() {
  stationIndex.forEach(e => e.marker.setIcon(stationIcon(e.line, e.station, false)));
}

/* Google's encoded polyline format. Inlined rather than pulling in the
   geometry library for one function. */
function decodePath(encoded) {
  const points = [];
  let index = 0, lat = 0, lng = 0;

  while (index < encoded.length) {
    for (const axis of [0, 1]) {
      let result = 0, shift = 0, byte;
      do {
        byte = encoded.charCodeAt(index++) - 63;
        result |= (byte & 0x1f) << shift;
        shift += 5;
      } while (byte >= 0x20);
      const delta = (result & 1) ? ~(result >> 1) : (result >> 1);
      if (axis === 0) lat += delta; else lng += delta;
    }
    points.push({ lat: lat / 1e5, lng: lng / 1e5 });
  }
  return points;
}

/* Mirrors the CSS breakpoint below — the stylesheet can shrink the text but
   only this caps the bubble itself. Read per open, so a rotation or a resized
   window is picked up without a listener. */
function infoWindowWidth() {
  return window.matchMedia("(max-width: 1024px), (pointer: coarse)").matches ? 215 : 280;
}

/* The two things every popup does before it opens, in the order that matters:
   one bubble at a time on a phone, and a width re-read per call so rotating the
   device resizes the next one. Three call sites had their own copy. */
function prepareInfoWindow() {
  if (onPhone()) closeLinePanel();
  infoWindow.setOptions({ maxWidth: infoWindowWidth() });
}

/* The phone layout specifically — the width at which the sidebar drops below
   the map. A tablet has room for a station bubble and a line card at once; a
   phone doesn't, so there they take turns. Read per call so rotating works. */
function onPhone() {
  return window.matchMedia("(max-width: 760px)").matches;
}

function openStation(entry) {
  const { station } = entry;

  // Closing the line panel first also lets its visibility restore settle
  // before the bubble anchors to a marker.
  prepareInfoWindow();

  const badges = entry.lines.map(l =>
    `<span class="badge" style="background:${l.color}">${l.name.split(" — ")[0]}</span>`
  ).join("");

  // With an address pinned, directions start from it rather than the user's
  // current location — that's almost always the question being asked here.
  const from = currentAddress
    ? `<p class="from">from ${escapeHtml(currentAddress.name)}</p>`
    : "";

  infoWindow.setContent(`
    <div class="iw">
      <h3>${escapeHtml(stationName(station))}</h3>
      <div class="badges">${badges}</div>
      ${station.addr ? `<p class="addr">${escapeHtml(stationAddr(station))}</p>` : ""}
      ${station.conn ? `<p class="conn">${escapeHtml(stationConn(station))}</p>` : ""}
      ${station.alert ? `
        <p class="alert">
          <span class="sym" role="img" aria-label="${escapeHtml(t("underConstructionCard"))}">&#9888;&#xFE0E;</span>
          <span>${escapeHtml(stationAlert(station))}.
            <a href="${alertsUrl()}" target="_blank" rel="noopener">${t("checkAlerts")}</a>
            ${t("forClosures")}</span>
        </p>` : ""}
      ${isAccessible(station) ? `
        <p class="a11y">
          <span class="sym" role="img" aria-label="${escapeHtml(accessLabel())}">&#9855;</span>
          <span><strong>${escapeHtml(accessLabel())}</strong><br>${escapeHtml(accessDetail())}</span>
        </p>` : ""}
      ${from}
      <div class="links">
        <a href="${directionsUrl(station, "transit")}" target="_blank" rel="noopener">${t("transitDirections")}</a>
        <a href="${directionsUrl(station, "walking")}" target="_blank" rel="noopener">${t("walking")}</a>
        <a href="${mapsUrl(station)}" target="_blank" rel="noopener">${t("openInMaps")}</a>
        ${isAccessible(station)
          ? `<a href="${alertsUrl()}" target="_blank" rel="noopener">${t("elevatorAlerts")}</a>`
          : ""}
      </div>
    </div>
  `);
  infoWindow.open({ map, anchor: entry.marker });

  map.panTo({ lat: station.lat, lng: station.lng });
  if (map.getZoom() < 14) map.setZoom(14);
}

/* =========================================================================
   Line details popup

   Clicking a route on the map — or the (i) button on a sidebar card — opens a
   card summarising the line and listing every stop in order.
   ========================================================================= */

let visibilitySnapshot = null;  // every layer's visibility before the popup isolated one
let openedAt = 0;               // guards the opening click from closing it again
let focusedLine = null;         // lineId whose stops are named regardless of zoom

function openLinePanel(line) {
  const el = document.getElementById("line-panel");
  const stops = line.stations;
  const length = lineLength(line);
  const transfers = stops.filter(s => s.transfer);

  // Lines sharing at least one station with this one.
  const meets = NETWORK.filter(other => other !== line &&
    other.stations.some(a => stops.some(b => b.name === a.name)));

  const tunnel = line.tunnel
    ? `${stationName(stops[line.tunnel[0]])} – ${stationName(stops[line.tunnel[1]])}`
    : null;

  const near = currentAddress ? closestOnLine(currentAddress, line) : null;

  const notes = [
    `<div><b>${escapeHtml(stationName(stops[0]))}</b> ↔ <b>${escapeHtml(stationName(stops[stops.length - 1]))}</b></div>`,
    tunnel ? `<div>${t("underground")}: <b>${escapeHtml(tunnel)}</b></div>` : "",
    meets.length
      ? `<div>${t("connectsWith")} <b>${meets.map(l => escapeHtml(lineName(l).split(" — ")[0])).join(", ")}</b>
         ${t("at")} ${transfers.map(s => escapeHtml(stationName(s))).join(", ")}</div>`
      : "",
    `<div>${t("allStopsAccessible")}</div>`,
    near
      ? `<div>${t("from")} ${escapeHtml(currentAddress.name)} : ${t("nearestIs")}
         <b>${escapeHtml(stationName(near.station))}</b>, ${formatDistance(near.dist)}</div>`
      : ""
  ].join("");

  const rows = stops.map((station, i) => `
    <div class="lp-stop${i === 0 || i === stops.length - 1 ? " end" : ""}${station.transfer ? " transfer" : ""}"
         style="color:${line.color}" data-station="${escapeHtml(station.name)}">
      <span class="dot"></span>
      <span class="label">${escapeHtml(stationName(station))}</span>
      ${isAccessible(station)
        ? `<span class="a11y" role="img" aria-label="${escapeHtml(accessLabel())}">&#9855;&#xFE0E;</span>`
        : ""}
      ${station.transfer ? `<span class="tag">${t("transfer")}</span>` : ""}
    </div>
  `).join("");

  el.innerHTML = `
    <div class="lp-head">
      <span class="lp-bar" style="background:${line.color}"></span>
      <span class="lp-title">
        <div class="n">${escapeHtml(lineName(line))}</div>
        <div class="fr">${escapeHtml(lang === "fr" ? line.name : line.nameFr)}</div>
      </span>
      <button id="lp-close" title="${t("close")}" aria-label="${t("closeLineDetails")}">&times;</button>
    </div>

    <div class="lp-stats">
      <div class="lp-stat"><div class="k">${t("stations")}</div><div class="v">${stops.length}</div></div>
      <div class="lp-stat"><div class="k">${t("length")}</div><div class="v">≈ ${formatDistance(length)}</div></div>
      <div class="lp-stat"><div class="k">${t("avgSpacing")}</div><div class="v">${formatDistance(length / (stops.length - 1))}</div></div>
      <div class="lp-stat"><div class="k">${t("transfers")}</div><div class="v">${transfers.length || t("none")}</div></div>
    </div>

    <div class="lp-notes">${notes}</div>

    <div class="lp-list">${rows}</div>
  `;

  if (onPhone()) infoWindow.close();   // the other half of one-popup-at-a-time

  el.hidden = false;
  document.body.classList.add("line-open");
  focusedLine = line.id;        // set before isolateLine, which recomputes labels
  isolateLine(line);
  zoomToLine(line);
  openedAt = performance.now();

  el.querySelector("#lp-close").addEventListener("click", closeLinePanel);

  el.querySelectorAll(".lp-stop").forEach(row => {
    row.addEventListener("click", () => {
      const entry = stationIndex.find(e => e.station.name === row.dataset.station);
      if (!entry) return;

      // Order matters on a phone, where this panel is about to close: closing
      // restores the visibility the popup overrode, so do it first and then
      // make sure the line is showing. The other way round, the restore would
      // undo it and the bubble would anchor to a detached marker.
      if (onPhone()) closeLinePanel();
      if (!layers[line.id].visible) applyLineVisibility(line.id, true);

      openStation(entry);
    });
  });
}

function closeLinePanel() {
  const el = document.getElementById("line-panel");
  if (el.hidden) return;
  el.hidden = true;
  el.innerHTML = "";
  document.body.classList.remove("line-open");
  focusedLine = null;
  restoreVisibility();
}

/* Frame the whole line, padded clear of the popup — which sits down the left
   on a desktop and across the bottom on a phone. Padding comes off the usable
   area, so a long line on a small screen can land below DETAIL_MIN_ZOOM and
   drop its dots; the popup lists every stop anyway. */
function zoomToLine(line) {
  const bounds = new google.maps.LatLngBounds();
  layers[line.id].path.forEach(point => bounds.extend(point));

  const narrow = window.matchMedia("(max-width: 760px)").matches;
  map.fitBounds(bounds, narrow
    ? { top: 20, right: 16, bottom: 200, left: 16 }
    : { top: 60, right: 60, bottom: 60, left: 300 });
}

/* The context layers move with the rail lines, and for the same reason. The
   two of them carry more ink than the network does — eight bus corridors and
   three dashed Stage 2 projects — so isolating Line 2 while leaving them up
   isn't isolating anything. Every layer goes down; the framed line stays. */
function applyTransitwayVisibility(visible) {
  syncCard(".line-card.transitway", visible);
  setTransitwayVisible(visible);
}

function applyFutureVisibility(visible) {
  syncCard(".line-card.future", visible);
  setFutureVisible(visible);
}

/* Keeps a sidebar card's switch honest when something other than a click on it
   changed the layer — which is what isolating a line does to all five. */
function syncCard(selector, visible) {
  const card = document.querySelector(selector);
  if (!card) return;
  card.classList.toggle("on", visible);
  card.querySelector(".toggle")?.setAttribute("aria-checked", String(visible));
}

/* Opening a line's details isolates it on the map; closing puts back whatever
   was showing beforehand, rather than blanket-enabling everything — a layer
   the user had deliberately switched off stays off. */
function isolateLine(line) {
  if (!visibilitySnapshot) {
    visibilitySnapshot = {
      lines: {},
      transitway: transitwayVisible,
      future: futureVisible
    };
    NETWORK.forEach(l => { visibilitySnapshot.lines[l.id] = layers[l.id].visible; });
  }
  NETWORK.forEach(l => applyLineVisibility(l.id, l === line));
  applyTransitwayVisibility(false);
  applyFutureVisibility(false);
}

function restoreVisibility() {
  if (!visibilitySnapshot) return;
  NETWORK.forEach(l => applyLineVisibility(l.id, visibilitySnapshot.lines[l.id]));
  applyTransitwayVisibility(visibilitySnapshot.transitway);
  applyFutureVisibility(visibilitySnapshot.future);
  visibilitySnapshot = null;
}

/* Measured along the real alignment, so this is the actual route length rather
   than the sum of the straight hops between stations. */
function lineLength(line) {
  const path = layers[line.id].path;
  let total = 0;
  for (let i = 1; i < path.length; i++) total += haversine(path[i - 1], path[i]);
  return total;
}

function closestOnLine(point, line) {
  return closestStation(point, line.stations);
}

function closestStation(point, stations) {
  let best = null;
  stations.forEach(station => {
    const dist = haversine(point, station);
    if (!best || dist < best.dist) best = { station, dist };
  });
  return best;
}

/* The two things the address panel needs from a line that the rapid bus
   pseudo-line can't answer the same way as a rail line: its colour follows the
   theme rather than being fixed, and its visibility lives in a flag rather
   than in `layers`. */
const lineColour = line => line.isTransitway ? palette().transitway : line.color;
const lineVisible = line => line.isTransitway ? transitwayVisible : layers[line.id].visible;

/* Keeps the map layer and the sidebar toggle in agreement. */
function applyLineVisibility(lineId, visible) {
  syncCard(`.line-card[data-line="${lineId}"]`, visible);
  setLineVisible(lineId, visible);
}

/* A visible line always draws its route. The detail laid over that route —
   station dots and tunnel dashes — only appears from DETAIL_MIN_ZOOM up.
   A transfer station survives as long as any one of its lines is showing. */
function updateDetailVisibility() {
  const zoom = map.getZoom();
  const detailed = zoom >= DETAIL_MIN_ZOOM;

  Object.values(layers).forEach(layer => {
    layer.route.setMap(layer.visible ? map : null);
    layer.tunnels.forEach(t => t.setMap(layer.visible && detailed ? map : null));
  });

  stationIndex.forEach(entry => {
    const onLive = entry.lines.some(l => layers[l.id].visible);

    // A framed line names every one of its stops, whatever the zoom. Framing
    // a 19 km line puts the camera below the usual thresholds, and the whole
    // point of framing it is to read its stops.
    const focused = focusedLine && entry.lines.some(l => l.id === focusedLine);
    const shown = (detailed || focused) && onLive;

    entry.marker.setMap(shown ? map : null);

    // Terminus names run ahead of their dots: below DETAIL_MIN_ZOOM the line
    // simply ends at its name, which is how a regional map reads. Everything
    // else stays tied to its dot.
    entry.labelShown = (shown || zoom >= entry.labelZoom) && onLive;
    entry.labelForced = !!focused;
  });

  /* Stage 2 and Transitway stations are stations too, so they leave with the
     rail dots rather than hanging on alone at zoom 11. Their lines stay drawn:
     a route is still worth seeing when its stops are too crowded to place. */
  const station = s => s instanceof google.maps.Marker;
  futureShapes.forEach(s =>
    s.setMap(futureVisible && (!station(s) || detailed) ? map : null));
  transitwayShapes.forEach(s =>
    s.setMap(transitwayVisible && (!station(s) || detailed) ? map : null));

  // Stage 2 names ride the same switch as its lines and dots; draw() still has
  // the final say on zoom and collisions.
  futureLabels.forEach(entry => { entry.labelShown = futureVisible; });
  transitLabels.forEach(entry => { entry.labelShown = transitwayVisible; });

  if (stationLabels) stationLabels.draw();
}

/* Universal Google Maps URLs — plain links, no API key or quota involved.
   Coordinates rather than station names, so the link can't land on the wrong
   "Rideau" somewhere else. */
function directionsUrl(station, mode) {
  const params = new URLSearchParams({
    api: "1",
    destination: `${station.lat},${station.lng}`,
    travelmode: mode
  });
  if (currentAddress) params.set("origin", `${currentAddress.lat},${currentAddress.lng}`);
  params.set("hl", lang);   // land on Google Maps in the reader's language
  return "https://www.google.com/maps/dir/?" + params;
}

function mapsUrl(station) {
  return "https://www.google.com/maps/search/?" + new URLSearchParams({
    api: "1",
    query: `${station.lat},${station.lng}`,
    hl: lang
  });
}

function setLineVisible(lineId, visible) {
  const layer = layers[lineId];
  if (!layer) return;
  layer.visible = visible;
  updateDetailVisibility();
  syncConnector(lineId, visible);
}

/* Hiding a layer also hides its address connector; the panel row stays but
   dims. Shared with the rapid bus toggle, which has the same two things to
   keep in step. */
function syncConnector(lineId, visible) {
  if (connectors[lineId]) connectors[lineId].setMap(visible ? map : null);

  const row = document.querySelector(`.near[data-line="${lineId}"]`);
  if (row) {
    row.classList.toggle("hidden-line", !visible);
    const ln = row.querySelector(".ln");
    if (ln) ln.textContent = ln.dataset.name + (visible ? "" : t("hidden").replace(/&middot;/g, "·"));
  }
}

/* =========================================================================
   Sidebar
   ========================================================================= */

function buildSidebar() {
  const container = document.getElementById("lines");
  container.innerHTML = "";

  NETWORK.forEach((line, i) => {
    const card = document.createElement("div");
    card.className = "line-card on" + (i === 0 ? " expanded" : "");
    card.dataset.line = line.id;

    const head = document.createElement("div");
    head.className = "line-head";
    head.innerHTML = `
      <span class="swatch" style="background:${line.color}"></span>
      <span class="line-meta">
        <span class="name">${escapeHtml(lineName(line))}</span><br>
        <span class="sub">${line.stations.length} ${t("stations").toLowerCase()} · ${escapeHtml(lineSpan(line))}</span>
      </span>
      <button class="line-info" title="${t("lineDetails")}" aria-label="${escapeHtml(t("detailsFor", lineName(line)))}">i</button>
      <span class="toggle" role="switch" aria-checked="true" title="${t("showHideOnMap")}"></span>
    `;
    head.addEventListener("click", e => {
      if (e.target.closest(".line-info")) {
        openLinePanel(line);
      } else if (e.target.classList.contains("toggle")) {
        applyLineVisibility(line.id, !card.classList.contains("on"));
      } else {
        card.classList.toggle("expanded");
      }
    });

    const list = document.createElement("div");
    list.className = "stations";

    line.stations.forEach(station => {
      const row = document.createElement("div");
      row.className = "station" + (station.transfer ? " transfer" : "");
      row.style.color = line.color;
      // Street names are searchable too, so "Bank St" finds Greenboro.
      row.dataset.name = (station.name + " " + stationName(station) + " " +
        (station.addr || "") + " " + (stationAddr(station) || "")).toLowerCase();
      if (station.addr) row.title = stationAddr(station);
      row.innerHTML = `
        <span class="dot"></span>
        <span class="label">${escapeHtml(stationName(station))}</span>
        ${isAccessible(station)
          ? `<span class="a11y" role="img" aria-label="${escapeHtml(accessLabel())}">&#9855;&#xFE0E;</span>`
          : ""}
        ${station.transfer ? `<span class="tag">${t("transfer")}</span>` : ""}
      `;
      row.addEventListener("click", () => {
        const entry = stationIndex.find(e => e.station.name === station.name);
        if (entry) openStation(entry);
      });
      list.appendChild(row);
    });

    card.append(head, list);
    container.appendChild(card);
  });

  container.appendChild(buildTransitwayCard());
  container.appendChild(buildFutureCard());
}

/* Expands into its stations the way a rail card does, but each row carries the
   routes calling there rather than a street address — for a bus interchange
   that IS the useful fact, and it's the one thing the map itself can't show
   without being clicked. On by default, unlike Stage 2: the Transitway is
   running today and is part of how the city actually moves. */
function buildTransitwayCard() {
  const card = document.createElement("div");
  card.className = "line-card transitway" + (transitwayVisible ? " on" : "");
  card.dataset.line = TRANSITWAY_LINE.id;

  const head = document.createElement("div");
  head.className = "line-head";
  head.innerHTML = `
    <span class="swatch transitway-swatch"></span>
    <span class="line-meta">
      <span class="name">${t("rapidBusRoutes")}</span><br>
      <span class="sub">${t("frequentCorridors", TRANSIT_STATIONS.length)}</span>
    </span>
    <span class="toggle" role="switch" aria-checked="${transitwayVisible}"
          title="${t("showHideRapidBus")}"></span>
  `;
  head.addEventListener("click", e => {
    if (e.target.classList.contains("toggle")) {
      const on = card.classList.toggle("on");
      e.target.setAttribute("aria-checked", String(on));
      setTransitwayVisible(on);
    } else {
      card.classList.toggle("expanded");
    }
  });

  const list = document.createElement("div");
  list.className = "stations";

  // North to south, matching how the rail cards run their lines end to end
  // rather than leaving the reader with the order the data happened to be in.
  [...TRANSIT_STATIONS].sort((a, b) => b.lat - a.lat).forEach(station => {
    const routes = stationRoutes(station);

    const row = document.createElement("div");
    row.className = "station bus-row";
    // Searchable by route as well as by name, so typing "63" finds every
    // station the 63 calls at — the reverse of what the row itself shows.
    // Both names, so "Aéroport" and "Airport" both find the station whichever
    // language is showing.
    row.dataset.name = (station.name + " " + stationName(station) + " " +
      routes.join(" ")).toLowerCase();
    row.innerHTML = `
      <span class="dot"></span>
      <span class="bus-meta">
        <span class="label">${escapeHtml(stationName(station))}</span>
        ${routes.length
          ? `<span class="bus-routes">${routeChips(routes)}</span>`
          : `<span class="none">${t("noRouteData")}</span>`}
      </span>
      ${station.shared ? `<span class="tag">${t("rail")}</span>`
        : station.stage2 ? `<span class="tag">${t("stage2Tag")}</span>` : ""}
    `;

    // A chip is a link out to a schedule; only a click on the rest of the row
    // means "show me this station".
    row.addEventListener("click", e => {
      if (e.target.closest(".route")) return;
      const entry = transitLabels.find(t => t.station.name === station.name);
      if (entry) openTransitStation(entry);
    });

    list.appendChild(row);
  });

  card.append(head, list);
  return card;
}

/* One card for all of Stage 2 rather than one per project — it's a single
   "show me what's coming" decision, and three more toggles would crowd out the
   lines that actually run. Off by default: the open network is the subject. */
function buildFutureCard() {
  const card = document.createElement("div");
  card.className = "line-card future" + (futureVisible ? " on" : "");

  const stops = FUTURE.reduce((n, p) => n + p.stations.length, 0);

  const head = document.createElement("div");
  head.className = "line-head";
  head.innerHTML = `
    <span class="swatch dashed-swatch"></span>
    <span class="line-meta">
      <span class="name">${t("underConstructionCard")}</span><br>
      <span class="sub">${t("stage2Stations", stops)}</span>
    </span>
    <span class="toggle" role="switch" aria-checked="${futureVisible}"
          title="${t("showHideWip")}"></span>
  `;
  head.addEventListener("click", e => {
    if (e.target.classList.contains("toggle")) {
      const on = card.classList.toggle("on");
      e.target.setAttribute("aria-checked", String(on));
      setFutureVisible(on);
    } else {
      card.classList.toggle("expanded");
    }
  });

  const list = document.createElement("div");
  list.className = "stations";
  FUTURE.forEach(project => {
    const row = document.createElement("div");
    row.className = "station future-row";
    row.style.color = project.color;
    // Searchable by the stations it will serve, so looking up "Moodie" surfaces
    // the project rather than coming back empty.
    row.dataset.name = (project.name + " " + lineName(project) + " " + project.note + " " +
      project.stations.map(s => s.name + " " + stationName(s)).join(" ")).toLowerCase();
    row.innerHTML = `
      <span class="dot"></span>
      <span class="label">${escapeHtml(lineName(project))}
        <span class="future-note">${escapeHtml(project.note)}${
          project.path ? "" : t("routeNotMapped")}</span>
      </span>
      <span class="tag">${project.stations.length}</span>
    `;
    list.appendChild(row);
  });

  card.append(head, list);
  return card;
}

function filterStations(q) {
  document.querySelectorAll(".line-card").forEach(card => {
    let hits = 0;
    card.querySelectorAll(".station").forEach(row => {
      const match = !q || (row.dataset.name || "").includes(q);
      row.style.display = match ? "" : "none";
      if (match) hits++;
    });
    card.style.display = q && hits === 0 ? "none" : "";
    if (q) card.classList.add("expanded");
  });
}

/* =========================================================================
   Address search

   The one search box does two things: it filters the station list as you
   type, and — from three characters on — asks Google Places for matching
   addresses nearby. Picking one drops a pin and measures it against every
   line, so the question "how close is this place to the train?" is answered
   without leaving the page.
   ========================================================================= */

// Autocomplete is biased to this box rather than restricted to it, so an
// address just outside town still resolves instead of silently vanishing.
const OTTAWA_BOUNDS = { west: -76.36, south: 44.96, east: -75.24, north: 45.58 };

const WALK_M_PER_MIN = 80;   // ~4.8 km/h
const WALK_DETOUR = 1.3;     // streets don't run in straight lines

let placesLib = null;        // null until the Places library resolves
let sessionToken = null;     // one token per autocomplete session, per billing rules
let geocoder = null;

let addrMarker = null;
let currentAddress = null;   // the pinned address, if any — used as a directions origin
const connectors = {};       // lineId -> dashed polyline from address to its nearest station

let predictions = [];
let activeIndex = -1;
let queryCounter = 0;        // guards against a slow response overwriting a newer one
let debounceTimer = null;

const searchEl = document.getElementById("search");
const suggestEl = document.getElementById("suggest");
const panelEl = document.getElementById("addr-panel");

function initSearch() {
  // Loaded lazily: the station half of the search box works with or without it.
  google.maps.importLibrary("places")
    .then(lib => { placesLib = lib; })
    .catch(() => { placesLib = null; });

  searchEl.addEventListener("input", () => {
    const q = searchEl.value.trim();
    filterStations(q.toLowerCase());

    clearTimeout(debounceTimer);
    if (q.length < 3) { hideSuggestions(); return; }
    debounceTimer = setTimeout(() => fetchSuggestions(q), 250);
  });

  searchEl.addEventListener("keydown", e => {
    if (e.key === "Escape") { hideSuggestions(); return; }

    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (!predictions.length) return;
      e.preventDefault();
      const step = e.key === "ArrowDown" ? 1 : -1;
      activeIndex = (activeIndex + step + predictions.length) % predictions.length;
      markActive();
      return;
    }

    if (e.key === "Enter") {
      e.preventDefault();
      if (predictions.length) choosePrediction(activeIndex < 0 ? 0 : activeIndex);
      else geocodeQuery(searchEl.value.trim());
    }
  });

  // pointerdown covers mouse and touch alike, and fires before the blur that
  // would otherwise tear the list down before the selection registered.
  suggestEl.addEventListener("pointerdown", e => {
    const row = e.target.closest(".sug");
    if (row) { e.preventDefault(); choosePrediction(Number(row.dataset.i)); }
  });

  document.addEventListener("pointerdown", e => {
    if (!e.target.closest(".search-wrap")) hideSuggestions();
  });
}

/* Google ships two autocomplete APIs and a key may carry either. The console
   calls the current one "Places API" (places.googleapis.com) and the older one
   "Places API (Legacy)" (places-backend.googleapis.com) — names close enough
   that enabling the wrong one looks like enabling the right one. So rather
   than demanding a particular API, try the modern one and fall back.

   The fallback is sticky: once the modern API answers "blocked", every later
   keystroke would get the same refusal, so stop asking. */
let placesMode = "modern";        // "modern" | "legacy" | "none"
let legacyAutocomplete = null;

async function fetchSuggestions(input) {
  const seq = ++queryCounter;

  if (!placesLib) {
    showSuggestMessage("Address search needs a Places API enabled on your key. " +
      "Press Enter to try a plain lookup.");
    return;
  }

  try {
    let found = null;

    if (placesMode === "modern") {
      try {
        found = await modernSuggestions(input);
      } catch (err) {
        if (!isBlocked(err)) throw err;
        placesMode = "legacy";   // demote once, quietly, and carry on
      }
    }
    if (found === null) found = await legacySuggestions(input);

    if (seq !== queryCounter) return;   // a newer keystroke already won
    predictions = found;
    renderSuggestions();
  } catch (err) {
    if (seq !== queryCounter) return;
    predictions = [];
    showSuggestMessage(explainLookupFailure(err));
  }
}

/* Both paths return the same shape, so the rest of the UI never learns which
   API answered: a label to show, and a way to turn it into coordinates. */
async function modernSuggestions(input) {
  sessionToken = sessionToken || new placesLib.AutocompleteSessionToken();
  const { suggestions } = await placesLib.AutocompleteSuggestion.fetchAutocompleteSuggestions({
    input,
    sessionToken,
    locationBias: OTTAWA_BOUNDS,
    includedRegionCodes: ["ca"],
    language: lang
  });

  return suggestions.map(s => s.placePrediction).filter(Boolean).map(p => ({
    main: text(p.mainText) || text(p.text),
    secondary: p.secondaryText ? text(p.secondaryText) : "",
    resolve: async () => {
      const place = p.toPlace();
      await place.fetchFields({ fields: ["location", "formattedAddress", "displayName"] });
      sessionToken = null;                 // the details call closes the session
      return {
        name: place.displayName || text(p.mainText),
        sub: place.formattedAddress || "",
        lat: place.location.lat(),
        lng: place.location.lng()
      };
    }
  }));
}

function legacySuggestions(input) {
  legacyAutocomplete = legacyAutocomplete || new placesLib.AutocompleteService();

  return new Promise((resolve, reject) => {
    legacyAutocomplete.getPlacePredictions(
      { input, bounds: OTTAWA_BOUNDS, componentRestrictions: { country: "ca" } },
      (results, status) => {
        const S = google.maps.places.PlacesServiceStatus;
        if (status === S.ZERO_RESULTS) return resolve([]);
        if (status !== S.OK) return reject(new Error("Places lookup failed: " + status));

        resolve(results.map(r => ({
          main: r.structured_formatting?.main_text || r.description,
          secondary: r.structured_formatting?.secondary_text || "",
          // The legacy predictions carry a place ID but no coordinates, and the
          // Geocoding API resolves one without needing Places details.
          resolve: async () => {
            geocoder = geocoder || new google.maps.Geocoder();
            const { results: hits } = await geocoder.geocode({ placeId: r.place_id });
            const best = hits[0];
            return {
              name: r.structured_formatting?.main_text || best.formatted_address.split(",")[0],
              sub: best.formatted_address,
              lat: best.geometry.location.lat(),
              lng: best.geometry.location.lng()
            };
          }
        })));
      }
    );
  });
}

function isBlocked(err) {
  return /blocked|has not been used in project|is disabled|SERVICE_DISABLED|PERMISSION_DENIED/i
    .test(String(err && err.message));
}

/* Google's own message is the useful part — it names the project and links
   straight to the page that fixes it — but it arrives as plain text, so the
   link can't be clicked from inside the dropdown. Escape it, then turn any URL
   back into an anchor, and add the one thing Google can't know: that Enter
   still works if the Geocoding API is enabled instead. */
function explainLookupFailure(err) {
  const raw = escapeHtml(err && err.message ? err.message : "unknown error");
  const linked = raw.replace(/https?:\/\/[^\s<]+/g, url =>
    `<a href="${url}" target="_blank" rel="noopener">${url}</a>`);

  const notEnabled = /has not been used in project|is disabled|SERVICE_DISABLED/i.test(raw);
  return notEnabled
    ? `<strong>Address search isn't switched on for this key.</strong><br>${linked}
       <br><br>Station search still works, and pressing Enter falls back to the
       Geocoding API if that one is enabled.`
    : `Address lookup failed: ${linked}`;
}

function renderSuggestions() {
  if (!predictions.length) { hideSuggestions(); return; }

  activeIndex = -1;
  suggestEl.innerHTML = predictions.map((p, i) => `
    <div class="sug" role="option" data-i="${i}">
      <div class="main">${escapeHtml(p.main)}</div>
      ${p.secondary ? `<div class="sub">${escapeHtml(p.secondary)}</div>` : ""}
    </div>
  `).join("");
  openSuggestions();
}

function showSuggestMessage(html) {
  predictions = [];
  activeIndex = -1;
  suggestEl.innerHTML = `<div class="msg">${html}</div>`;
  openSuggestions();
}

function openSuggestions() {
  suggestEl.hidden = false;
  searchEl.setAttribute("aria-expanded", "true");
}

function hideSuggestions() {
  suggestEl.hidden = true;
  suggestEl.innerHTML = "";
  searchEl.setAttribute("aria-expanded", "false");
  predictions = [];
  activeIndex = -1;
}

function markActive() {
  suggestEl.querySelectorAll(".sug").forEach((el, i) =>
    el.classList.toggle("active", i === activeIndex)
  );
}

/* Places wraps prediction strings in a FormattableText object. */
function text(v) {
  return v == null ? "" : String(v.text != null ? v.text : v);
}

async function choosePrediction(i) {
  const prediction = predictions[i];
  if (!prediction) return;
  hideSuggestions();

  try {
    const addr = await prediction.resolve();
    showAddress({
      name: addr.name || searchEl.value.trim(),
      sub: addr.sub,
      lat: addr.lat,
      lng: addr.lng
    });
  } catch (err) {
    showSuggestMessage("Could not load that address: " + escapeHtml(err.message || "unknown error"));
  }
}

/* Fallback for when Places isn't available on the key — needs the Geocoding
   API instead, so it may not work either. Either way the user gets told why. */
async function geocodeQuery(q) {
  if (!q) return;
  try {
    geocoder = geocoder || new google.maps.Geocoder();
    const { results } = await geocoder.geocode({ address: q, bounds: OTTAWA_BOUNDS, region: "ca" });
    if (!results.length) { showSuggestMessage("No address matched that."); return; }

    const best = results[0];
    showAddress({
      name: best.formatted_address.split(",")[0],
      sub: best.formatted_address,
      lat: best.geometry.location.lat(),
      lng: best.geometry.location.lng()
    });
  } catch (err) {
    showSuggestMessage("Address lookup needs the <strong>Places API (New)</strong> or <strong>Geocoding API</strong> enabled on your key.");
  }
}

/* ---- Placing the result ---- */

function showAddress(addr) {
  clearAddress({ keepInput: true });
  hideSuggestions();
  searchEl.value = addr.name;
  filterStations("");   // the address text shouldn't keep hiding the station list

  currentAddress = addr;

  addrMarker = new google.maps.Marker({
    map,
    position: { lat: addr.lat, lng: addr.lng },
    title: addr.sub || addr.name,
    zIndex: 50,
    icon: addressIcon()
  });

  const nearest = nearestPerLine(addr);
  nearest.forEach(hit => drawConnector(addr, hit));
  renderAddressPanel(addr, nearest);

  // Frame the address together with its single closest station; including
  // every line's nearest would zoom back out to the whole network.
  const bounds = new google.maps.LatLngBounds();
  bounds.extend({ lat: addr.lat, lng: addr.lng });
  bounds.extend({ lat: nearest[0].station.lat, lng: nearest[0].station.lng });
  map.fitBounds(bounds, { top: 70, right: 70, bottom: 70, left: 70 });
  google.maps.event.addListenerOnce(map, "idle", () => {
    if (map.getZoom() > 16) map.setZoom(16);
  });
}

/* Closest station on each line, nearest line first — rapid bus included, since
   the nearest way out of a neighbourhood is often a bus station, and a panel
   that only ever named train stops answered a narrower question than the one
   being asked. A station both networks serve (Hurdman, Baseline) can appear
   twice, once per row; that is the honest answer rather than a duplicate. */
function nearestPerLine(addr) {
  const hits = NETWORK.map(line => ({ line, ...closestOnLine(addr, line) }));

  const bus = closestStation(addr, TRANSIT_STATIONS);
  if (bus) hits.push({ line: TRANSITWAY_LINE, ...bus });

  return hits.sort((a, b) => a.dist - b.dist);
}

function drawConnector(addr, hit) {
  connectors[hit.line.id] = new google.maps.Polyline({
    path: [{ lat: addr.lat, lng: addr.lng }, { lat: hit.station.lat, lng: hit.station.lng }],
    map: lineVisible(hit.line) ? map : null,
    geodesic: true,
    strokeOpacity: 0,
    zIndex: 4,
    icons: connectorIcons(lineColour(hit.line))
  });
}

/* Split out because the rapid bus connector is recoloured on a theme change —
   its colour is a palette entry, not a fixed line colour. */
function connectorIcons(colour) {
  return [{
    icon: {
      path: "M 0,-1 0,1",
      strokeColor: colour,
      strokeOpacity: 0.9,
      strokeWeight: 2.5,
      scale: 2
    },
    offset: "0",
    repeat: "10px"
  }];
}

function renderAddressPanel(addr, nearest) {
  const rows = nearest.map(hit => {
    const hidden = !lineVisible(hit.line);
    const short = hit.line.name.split(" — ")[0];
    // The rapid bus bar takes the CSS token rather than an inline colour, so it
    // follows a theme change without the panel being re-rendered.
    const bar = hit.line.isTransitway ? "var(--busline)" : hit.line.color;
    return `
      <div class="near${hidden ? " hidden-line" : ""}"
           data-station="${escapeHtml(hit.station.name)}" data-line="${hit.line.id}">
        <span class="bar" style="background:${bar}"></span>
        <span class="who">
          <span class="st">${escapeHtml(hit.station.name)}</span><br>
          <span class="ln" data-name="${escapeHtml(short)}">${escapeHtml(short)}${hidden ? t("hidden") : ""}</span>
        </span>
        <span class="dist">
          <span class="m">${formatDistance(hit.dist)}</span><br>
          <span class="walk">${t("minWalk", walkMinutes(hit.dist))}</span>
        </span>
      </div>
    `;
  }).join("");

  panelEl.innerHTML = `
    <div class="addr-head">
      <div class="addr-name">
        ${escapeHtml(addr.name)}
        ${addr.sub ? `<div class="addr-sub">${escapeHtml(addr.sub)}</div>` : ""}
      </div>
      <button id="addr-clear" title="${t("clearAddress")}" aria-label="${t("clearAddress")}">&times;</button>
    </div>
    ${rows}
    <div class="addr-foot">${t("straightLine")}</div>
  `;
  panelEl.hidden = false;

  panelEl.querySelector("#addr-clear").addEventListener("click", () => clearAddress());
  panelEl.querySelectorAll(".near").forEach(row => {
    row.addEventListener("click", () => {
      // Dispatch on the row's own line, not on the station name: a station both
      // networks serve is in both lists, and the rapid bus row should open the
      // bus popup even though a rail entry of the same name exists.
      const entry = row.dataset.line === TRANSITWAY_LINE.id
        ? transitLabels.find(e => e.station.name === row.dataset.station)
        : stationIndex.find(e => e.station.name === row.dataset.station);
      if (!entry) return;
      if (entry.isTransit) openTransitStation(entry);
      else openStation(entry);
    });
  });
}

function clearAddress(opts = {}) {
  if (addrMarker) { addrMarker.setMap(null); addrMarker = null; }
  currentAddress = null;
  Object.keys(connectors).forEach(id => {
    connectors[id].setMap(null);
    delete connectors[id];
  });
  panelEl.hidden = true;
  panelEl.innerHTML = "";

  if (!opts.keepInput) {
    searchEl.value = "";
    filterStations("");
  }
}

function haversine(a, b) {
  const R = 6371000, rad = d => d * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 +
            Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

/* French writes "1,2 km" with a comma and a non-breaking space before the
   unit; toLocaleString handles the separator, the NBSP is ours. */
function formatDistance(m) {
  const nbsp = lang === "fr" ? "\u00a0" : " ";
  return m < 1000
    ? `${formatNumber(Math.round(m / 10) * 10)}${nbsp}m`
    : `${formatNumber(m / 1000, 1)}${nbsp}km`;
}

function walkMinutes(m) {
  return Math.max(1, Math.round(m * WALK_DETOUR / WALK_M_PER_MIN));
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
  );
}

/* Runs at parse time, before the Maps API loads, so a stored dark theme is in
   place before anything paints. The map half of setTheme no-ops until initMap
   has built one. */
setTheme(storedTheme() || "light");
lang = storedLang() === "fr" ? "fr" : "en";
applyLanguage();       // before the first paint, so nothing flashes English
initSidebarToggle();   // pure DOM, so it works even if the Maps API never loads

/* Google calls this for every auth rejection without saying which one, and the
   causes need different fixes. The message used to name only a missing key,
   which sent you to config.js even when the real problem was that this origin
   isn't on the key's referrer allowlist — the usual story the first time you
   open the page from a phone. Naming the origin makes it copy-pasteable. */
window.gm_authFailure = () => {
  const el = document.getElementById("error");
  const fromFile = location.protocol === "file:";
  const origin = escapeHtml(location.origin);

  el.classList.add("on");
  document.body.classList.add("auth-failed");
  el.innerHTML = "<div class='inner'>" + (fromFile
    ? `${t("authFileTitle")} <code>file://</code>${t("authFileBody")}`
    : t("authOriginTitle", origin) + t("authOriginBody", origin)) + "</div>";
};
</script>

<script src="config.deploy.js"></script>
<!-- Local, untracked file that sets window.MAPS_API_KEY (see config.example.js) -->
<script src="config.js"></script>

<!-- Google Maps JavaScript API loader -->
<script>
  (g => {
    var h, a, k, p = "The Google Maps JavaScript API", c = "google", l = "importLibrary",
        q = "__ib__", m = document, b = window;
    b = b[c] || (b[c] = {});
    var d = b.maps || (b.maps = {}), r = new Set(), e = new URLSearchParams(),
        u = () => h || (h = new Promise(async (f, n) => {
          await (a = m.createElement("script"));
          e.set("libraries", [...r] + "");
          for (k in g) e.set(k.replace(/[A-Z]/g, t => "_" + t[0].toLowerCase()), g[k]);
          e.set("callback", c + ".maps." + q);
          a.src = `https://maps.${c}apis.com/maps/api/js?` + e;
          d[q] = f;
          a.onerror = () => h = n(Error(p + " could not load."));
          a.nonce = m.querySelector("script[nonce]")?.nonce || "";
          m.head.append(a);
        }));
    d[l] ? console.warn(p + " only loads once. Ignoring:", g)
         : d[l] = (f, ...n) => r.add(f) && u().then(() => d[l](f, ...n));
  })({
    key: window.MAPS_API_KEY || "YOUR_API_KEY_HERE",
    v: "weekly",
    /* The basemap's own labels — street names, rivers, place names — are fixed
       here at load and have no setter afterwards. This is the reason switching
       language reloads the page rather than re-rendering in place. Read from
       localStorage directly: the main script's `lang` isn't in scope from this
       loader block. */
    language: (() => {
      try { return localStorage.getItem("otm-lang") === "fr" ? "fr" : "en"; }
      catch (e) { return "en"; }
    })(),
    region: "CA"
  });

  (async () => {
    await google.maps.importLibrary("maps");
    // StreetViewPanorama lives in its own library; the Pegman control needs it
    // present before it can drop anyone into a panorama.
    await google.maps.importLibrary("streetView");
    initMap();
  })().catch(err => {
    const el = document.getElementById("error");
    el.classList.add("on");
    document.body.classList.add("auth-failed");
    el.innerHTML = "<div class='inner'>" + t("loadFailed") +
      escapeHtml(err.message) + "</div>";
  });
</script>
