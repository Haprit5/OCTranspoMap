<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ottawa Rapid Transit — Rail and Bus Map</title>
<style>
  /* Two themes, one token set. Anything that differs between light and dark
     goes through a variable here; the only fixed colours left in the sheet are
     inside .iw, because Google renders the info window on a white card in both
     themes, and pure #fff on saturated line colours.

     Light is the default, so it lives on bare :root and dark is the override.
     That ordering matters: the stylesheet is applied before any script runs,
     so whichever theme sits on :root is what paints first. Putting the default
     there means no flash of the wrong theme on load. */
  :root {
    /* Tells the browser which way to paint the things CSS can't reach: the
       scrollbar on the station list, the search field's inner furniture, form
       focus rings. Without it a dark theme keeps light native controls, most
       visibly as a white scrollbar down the sidebar in Chrome. */
    color-scheme: light;

    --bg: #eef1f5;
    --panel: #ffffff;
    --panel-2: #f4f6fa;
    --panel-3: #f7f9fc;
    --glass: rgba(255, 255, 255, .94);
    --glass-strong: rgba(255, 255, 255, .97);
    --line: #d5dde7;
    --text: #1b2430;
    --muted: #5c6a7d;
    --faint: #8b96a6;
    /* Must match PALETTES.light.transitway — the legend has to show the
       colour actually drawn on the map. */
    --busline: #9fb2d9;
    --placeholder: #9aa5b4;
    --hover: #eaeff6;
    --hover-2: #dfe7f1;
    --switch: #c4cdda;
    --map-bg: #e6eaef;
    --legend-dash: #47535f;
    --shadow: rgba(20, 32, 54, .16);
    --accent: #1a73e8;
    --radius: 10px;
  }

  :root.dark {
    color-scheme: dark;

    --bg: #10131a;
    --panel: #171b24;
    --panel-2: #1e232e;
    --panel-3: #141821;
    --glass: rgba(23, 27, 36, .93);
    --glass-strong: rgba(23, 27, 36, .96);
    --line: #2a303d;
    --text: #e8ecf3;
    --muted: #97a1b3;
    --faint: #737d90;
    --busline: #6274c4;   /* matches PALETTES.dark.transitway */
    --placeholder: #6f7889;
    --hover: #232937;
    --hover-2: #2a3140;
    --switch: #39404f;
    --map-bg: #0c0f15;
    --legend-dash: #cfd6e2;
    --shadow: rgba(0, 0, 0, .5);
    --accent: #4a9eff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;      /* Safari resizes text on rotate without this */
    text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  button, .toggle, .station, .near, .lp-stop, .sug {
    touch-action: manipulation;          /* no 300 ms double-tap-zoom delay */
  }

  #app {
    display: grid;
    grid-template-columns: 340px 1fr;
    height: 100%;
  }

  /* ---------- Sidebar ---------- */

  #sidebar {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  header.brand {
    position: relative;
    padding: 18px 52px 14px 18px;   /* room on the right for the close button */
    border-bottom: 1px solid var(--line);
  }

  header.brand h1 {
    margin: 0;
    font-size: 17px;
    letter-spacing: -0.01em;
  }

  header.brand p {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--muted);
  }

  .search-wrap {
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    position: relative;
  }

  #search {
    width: 100%;
    padding: 9px 11px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 13px;
    outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--placeholder); }

  /* ---------- Address suggestions ---------- */

  #suggest {
    position: absolute;
    left: 14px; right: 14px; top: calc(100% - 6px);
    z-index: 30;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 8px 24px var(--shadow);
    overflow: hidden;
    max-height: 280px;
    overflow-y: auto;
  }
  #suggest[hidden] { display: none; }

  #suggest .sug {
    padding: 8px 11px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  #suggest .sug:last-child { border-bottom: none; }
  #suggest .sug:hover,
  #suggest .sug.active { background: var(--hover-2); }
  #suggest .sug .main { font-size: 12.5px; }
  #suggest .sug .sub { font-size: 11px; color: var(--muted); }

  #suggest .msg {
    padding: 9px 11px;
    font-size: 11.5px;
    line-height: 1.45;
    color: var(--muted);
  }
  #suggest .msg strong { color: var(--text); }
  /* Console URLs are long; let them wrap rather than widen the dropdown. */
  #suggest .msg a {
    color: var(--accent);
    word-break: break-all;
  }

  /* ---------- Address result panel ---------- */

  #addr-panel {
    border-bottom: 1px solid var(--line);
    padding: 12px 14px 10px;
    background: var(--panel-3);
  }
  #addr-panel[hidden] { display: none; }

  #addr-panel .addr-head {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 10px;
  }
  #addr-panel .addr-name { flex: 1; min-width: 0; font-weight: 600; font-size: 13px; }
  #addr-panel .addr-sub { font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 2px; }

  /* Shared by the address panel and the line popup. */
  #addr-clear, #lp-close {
    background: none;
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 6px;
    width: 22px; height: 22px;
    line-height: 1;
    font-size: 14px;
    cursor: pointer;
    flex: none;
  }
  #addr-clear:hover, #lp-close:hover { color: var(--text); border-color: var(--accent); }

  .near {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 6px 4px;
    border-radius: 6px;
    cursor: pointer;
  }
  .near:hover { background: var(--hover); }
  .near .bar { width: 4px; height: 26px; border-radius: 2px; flex: none; }
  .near .who { flex: 1; min-width: 0; }
  .near .who .st { font-size: 12.5px; }
  .near .who .ln { font-size: 10.5px; color: var(--muted); }
  .near .dist { text-align: right; flex: none; }
  .near .dist .m { font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .near .dist .walk { font-size: 10.5px; color: var(--muted); }
  .near.hidden-line { opacity: .45; }

  #addr-panel .addr-foot {
    margin-top: 8px;
    font-size: 10.5px;
    color: var(--muted);
  }

  #lines {
    overflow-y: auto;
    flex: 1;
    padding: 8px 10px 20px;
    min-height: 0;
  }

  .line-card {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
  }

  .line-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 12px;
    cursor: pointer;
    /* Safari wants the prefix until 16.4, and this header is the one thing a
       double-tap would otherwise select instead of expanding. */
    -webkit-user-select: none;
    user-select: none;
  }
  .line-head:hover { background: var(--hover); }

  .swatch {
    width: 10px;
    height: 26px;
    border-radius: 5px;
    flex: none;
  }

  .line-meta { flex: 1; min-width: 0; }
  .line-meta .name { font-weight: 600; font-size: 13.5px; }
  .line-meta .sub { font-size: 11.5px; color: var(--muted); }

  .toggle {
    width: 34px; height: 20px;
    border-radius: 10px;
    background: var(--switch);
    position: relative;
    flex: none;
    transition: background .15s;
  }
  .toggle::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #fff;
    transition: transform .15s;
  }
  .line-card.on .toggle { background: var(--accent); }
  .line-card.on .toggle::after { transform: translateX(14px); }

  .stations { display: none; border-top: 1px solid var(--line); padding: 6px 0; }
  .line-card.expanded .stations { display: block; }

  .station {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 14px 6px 16px;
    cursor: pointer;
    font-size: 12.5px;
  }
  .station:hover { background: var(--hover); }

  .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    border: 2px solid currentColor;
    background: var(--panel-2);
    flex: none;
  }
  .station.transfer .dot { background: currentColor; }

  .station .label { flex: 1; color: var(--text); }
  /* Keeping this mark grey takes two mechanisms, because engines disagree:
     U+FE0E plus font-variant-emoji asks for the monochrome text glyph (Chrome
     131+, Firefox 133+), and the grayscale filter catches everywhere that
     ignores both — Safari and Android still paint the colour emoji, which
     would come out blue. The info window keeps the colour version.
     Both stop lists — sidebar and line popup — share this. */
  .station .a11y,
  #line-panel .lp-stop .a11y {
    font-size: 12px;
    flex: none;
    color: var(--faint);
    font-variant-emoji: text;
    filter: grayscale(1);
    opacity: .8;
  }
  .station:hover .a11y { color: var(--muted); opacity: 1; }
  .station .tag {
    font-size: 10px;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
  }

  footer.note {
    padding: 10px 16px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: var(--muted);
  }
  footer.note a { color: var(--muted); }

  /* ---------- Map ---------- */

  #map { width: 100%; height: 100%; background: var(--map-bg); }

  #map-wrap { position: relative; min-width: 0; }

  /* The map is raster — no map ID means no vector tiles, so it can't be
     rotated or tilted and north is always up. The compass is therefore fixed,
     which is still worth having: it's what tells you at a glance that Blair is
     the eastbound end and Limebank the southbound one. */
  /* Compass over legend, stacked rather than each pinned to its own offset —
     the legend's height changes with its rows, so a hard-coded bottom for the
     compass would drift the moment a row is added. */
  #map-corner {
    position: absolute;
    left: 12px; bottom: 24px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }

  #compass {
    width: 46px; height: 46px;
    display: grid;
    place-items: center;
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 50%;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  #compass svg { width: 27px; height: 27px; display: block; }
  #compass .north { fill: var(--text); }
  #compass .south { fill: var(--muted); opacity: .5; }
  #compass .tick {
    position: absolute;
    top: 2px;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: .06em;
    color: var(--muted);
  }

  /* Nothing on the map applies inside a panorama, the compass included. */
  body.streetview #compass { display: none; }

  #legend {
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 12px;
    font-size: 12px;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  #legend .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  #legend .row:first-of-type { margin-top: 0; }
  #legend .bar { width: 22px; height: 4px; border-radius: 2px; }
  #legend .title { font-weight: 600; margin-bottom: 8px; }
  #legend .dashed {
    width: 22px; height: 0;
    border-top: 3px dashed var(--legend-dash);
  }
  /* Same two mechanisms as the station list, and for the same reason — without
     them this prints as a blue colour emoji in every engine while the identical
     mark in the sidebar prints grey. */
  #legend .sym {
    width: 22px;
    text-align: center;
    font-size: 14px;
    color: var(--muted);
    font-variant-emoji: text;
    filter: grayscale(1);
  }
  #legend .bar.under-construction {
    background: repeating-linear-gradient(90deg,
      var(--muted) 0 4px, transparent 4px 7px);
  }

  /* Thin, to say the same thing the map does: these sit under the trains. */
  #legend .bar.transitway-bar { height: 2px; background: var(--busline); }
  .line-card.transitway .swatch.transitway-swatch { background: var(--busline); width: 4px; }

  /* Stage 2 reads as provisional: hollow swatch, dimmed rows. */
  .line-card.future .swatch.dashed-swatch {
    background: repeating-linear-gradient(180deg,
      var(--muted) 0 5px, transparent 5px 9px);
  }
  .station.future-row { cursor: default; }
  .station.future-row:hover { background: none; }
  .station.future-row .dot { opacity: .6; }

  /* A rapid bus row is two lines, not one — the station and the routes calling
     there — so it stops being a centred flex row and hangs the dot from the
     top instead. */
  .station.bus-row { align-items: flex-start; }
  .station.bus-row .dot {
    margin-top: 5px;
    background: var(--busline);
    border-color: var(--busline);
  }
  .bus-meta { flex: 1; min-width: 0; }
  .bus-meta .label { display: block; }
  .bus-meta .none { font-size: 10.5px; color: var(--faint); font-style: italic; }
  .bus-routes {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    margin-top: 4px;
  }
  /* The sidebar twin of .iw .route. Same chip, different token set — the info
     window is painted on Google's white card in both themes, this isn't. */
  .bus-routes .route {
    min-width: 22px;
    padding: 1px 5px;
    border-radius: 4px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    text-align: center;
    text-decoration: none;
  }
  .bus-routes .route:hover {
    background: var(--hover-2);
    border-color: var(--busline);
    color: var(--text);
  }
  .future-note {
    display: block;
    font-size: 10.5px;
    color: var(--muted);
  }

  /* ---------- Line details popup ---------- */

  #line-panel {
    position: absolute;
    left: 12px; top: 12px;
    width: 272px;
    max-height: calc(100% - 24px);
    display: flex;
    flex-direction: column;
    background: var(--glass-strong);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 10px 30px var(--shadow);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    overflow: hidden;
    z-index: 20;
  }
  #line-panel[hidden] { display: none; }

  /* The legend and the popup share the left gutter — popup wins. */
  body.line-open #legend { display: none; }

  /* Collapsing the sidebar hands its column to the map. */
  body.sidebar-hidden #sidebar { display: none; }
  body.sidebar-hidden #app { grid-template-columns: 1fr; }

  /* The control is one idea in two places: a hamburger over the map when the
     sidebar is away, and an × in the sidebar's own corner when it's there.
     Only ever one of them is on screen. */
  #sidebar-open {
    position: absolute;
    left: 12px; top: 12px;
    z-index: 25;
    display: none;
    place-items: center;
    width: 36px; height: 36px;
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--text);
    cursor: pointer;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  body.sidebar-hidden #sidebar-open { display: grid; }
  #sidebar-open:hover { border-color: var(--accent); }

  /* Three bars drawn from one element, so they inherit colour with the theme. */
  #sidebar-open .bars,
  #sidebar-open .bars::before,
  #sidebar-open .bars::after {
    display: block;
    width: 15px; height: 2px;
    border-radius: 1px;
    background: currentColor;
  }
  #sidebar-open .bars { position: relative; }
  #sidebar-open .bars::before,
  #sidebar-open .bars::after { content: ""; position: absolute; left: 0; }
  #sidebar-open .bars::before { top: -5px; }
  #sidebar-open .bars::after { top: 5px; }

  #sidebar-close {
    position: absolute;
    top: 14px; right: 14px;
    width: 28px; height: 28px;
    background: none;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--muted);
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
  }
  #sidebar-close:hover { color: var(--text); border-color: var(--accent); }

  /* The hamburger takes the top-left corner the line popup wants, so the popup
     steps down out of its way — but only while the sidebar is away. */
  body.sidebar-hidden #line-panel { top: 60px; max-height: calc(100% - 72px); }

  /* Nothing the map's own controls do applies inside a Street View panorama. */
  /* #sidebar-open is listed separately because it isn't inside #map-controls —
     it sits at the map's top-left on its own, so hiding the control cluster
     doesn't reach it. Must stay after the body.sidebar-hidden rule that shows
     it: same specificity, so source order decides. */
  body.streetview #legend,
  body.streetview #map-controls,
  body.streetview #sidebar-open { display: none; }

  #line-panel .lp-head {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 12px;
    border-bottom: 1px solid var(--line);
  }
  #line-panel .lp-bar { width: 6px; border-radius: 3px; flex: none; align-self: stretch; min-height: 32px; }
  #line-panel .lp-title { flex: 1; min-width: 0; }
  #line-panel .lp-title .n { font-weight: 600; font-size: 13.5px; }
  #line-panel .lp-title .fr { font-size: 11px; color: var(--muted); font-style: italic; }

  #line-panel .lp-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px 10px;
    padding: 11px 12px;
  }
  #line-panel .lp-stat .k {
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--muted);
  }
  #line-panel .lp-stat .v { font-size: 12.5px; }

  #line-panel .lp-notes {
    padding: 0 12px 11px;
    font-size: 11.5px;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
  }
  #line-panel .lp-notes div { margin-top: 4px; }
  #line-panel .lp-notes b { color: var(--text); font-weight: 500; }

  #line-panel .lp-list { overflow-y: auto; padding: 7px 0 10px; }

  #line-panel .lp-stop {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 5px 12px;
    cursor: pointer;
    font-size: 12.5px;
    position: relative;
  }
  #line-panel .lp-stop:hover { background: var(--hover); }

  /* Spine joining consecutive stops, aligned to the centre of the 9px dot. */
  #line-panel .lp-stop::before {
    content: "";
    position: absolute;
    left: 15.5px; top: 50%; bottom: -5px;
    width: 2px;
    background: currentColor;
    opacity: .45;
  }
  #line-panel .lp-stop:last-child::before { display: none; }

  #line-panel .lp-stop.transfer .dot { background: currentColor; }
  #line-panel .lp-stop .label { flex: 1; color: var(--text); }
  #line-panel .lp-stop.end .label { font-weight: 600; }
  #line-panel .lp-stop .tag {
    font-size: 10px;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
    flex: none;
  }

  /* Sidebar "line details" button */
  .line-info {
    background: none;
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 50%;
    width: 20px; height: 20px;
    line-height: 1;
    font-size: 11px;
    font-style: italic;
    font-family: Georgia, serif;
    cursor: pointer;
    flex: none;
  }
  .line-info:hover { color: var(--text); border-color: var(--accent); }

  #map-controls {
    position: absolute;
    right: 12px; top: 12px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }

  /* Segmented controls — basemap and theme share one look. */

  .segmented {
    display: flex;
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }

  .segmented button {
    background: none;
    border: none;
    border-right: 1px solid var(--line);
    color: var(--muted);
    padding: 8px 12px;
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
  }
  .segmented button:last-child { border-right: none; }
  .segmented button:hover { color: var(--text); }
  .segmented button.active { background: var(--accent); color: #fff; font-weight: 600; }

  /* Station and address markers are drawn by the Maps API as vector symbols
     (see stationIcon), so they carry no CSS of their own. */

  /* ---------- Station name labels ---------- */

  /* Labels share markerLayer with the station dots, and the API gives each dot
     its own z-index (10, or 20 for an interchange). Left at auto this container
     sits under all of them, so a neighbouring dot or the route beneath it drew
     over the text. Above the dots, below the info window's floatPane. */
  .stop-labels { position: absolute; top: 0; left: 0; z-index: 40; }

  .stop-label {
    position: absolute;
    top: 0; left: 0;
    white-space: nowrap;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text);
    /* A halo instead of a plate: names stay legible over any basemap without
       25 solid chips cluttering the view.

       Eight hard offsets rather than a few blurred ones. A blurred shadow is
       semi-transparent at its edge, so a 5px route colour behind the text still
       showed between the letterforms and read as the line being drawn on top —
       it never was; labels sit in markerLayer, routes in overlayLayer below.
       Zero-blur offsets in every direction give a genuinely opaque ring, and
       the blurred one just softens the outside edge. */
    text-shadow:
      -2px -2px 0 var(--bg),  0 -2px 0 var(--bg),  2px -2px 0 var(--bg),
      -2px  0   0 var(--bg),                       2px  0   0 var(--bg),

  }

  /* Hover no longer summons the name — it's already there — so it emphasises. */
  .stop-label.hot { color: var(--accent); }

  /* Stage 2 names read exactly like the rest — the hollow dot and the dashed
     line already say "not yet", so styling the text differently as well was
     saying it twice. The class stays as a hook for ordering and testing. */

  /* Over a photograph the halo has to be black whichever theme is active. */
  body.imagery .stop-label {
    color: #fff;
    text-shadow:
      -2px -2px 0 #000,  0 -2px 0 #000,  2px -2px 0 #000,
      -2px  0   0 #000,                  2px  0   0 #000,
      -2px  2px 0 #000,  0  2px 0 #000,  2px  2px 0 #000,
       0 0 5px #000;
  }

  /* ---------- Info window ---------- */

  .iw { color: #1a1d23; font-family: inherit; min-width: 190px; }
  .iw h3 { margin: 0 0 2px; font-size: 14.5px; }
  .iw .badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .iw .badge {
    color: #fff;
    font-size: 10.5px;
    font-weight: 600;
    border-radius: 4px;
    padding: 2px 7px;
  }
  .iw .addr { margin: 0 0 3px; font-size: 12px; color: #374151; }

  .iw .a11y {
    display: flex;
    align-items: flex-start;
    gap: 7px;
    margin: 8px 0 0;
    padding: 6px 8px;
    background: #eef2ff;
    border-radius: 6px;
    font-size: 11.5px;
    color: #3730a3;
    line-height: 1.4;
  }
  .iw .a11y .sym { font-size: 15px; line-height: 1.1; }
  .iw .a11y strong { font-weight: 600; }

  .iw .conn { margin: 0; font-size: 12px; color: #4b5563; }

  /* Route numbers as chips — a paragraph of 31 comma-separated numbers is
     unreadable, and these are things you scan for one value. */
  .iw .routes {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 8px;
    max-height: 132px;
    overflow-y: auto;
  }
  /* Every route number is a link to that route's schedule. Styled as a chip
     rather than as a link — underlining a grid of two-digit numbers turns it
     into noise — so the affordance is carried by the hover state instead. */
  .iw .route {
    display: block;
    min-width: 26px;
    padding: 2px 6px;
    border-radius: 4px;
    background: #eef1f5;
    border: 1px solid #d7dee7;
    font-size: 11px;
    font-weight: 600;
    color: #33415a;
    text-align: center;
    text-decoration: none;
  }
  .iw a.route:hover { background: #dbe4f0; border-color: #9fb2cc; color: #16233a; }

  /* Amber rather than the blue used for accessibility: this is a caveat about
     the station, not a facility it offers. Says what is being built, and sends
     you to OC Transpo for today's actual closures — live status can't live in
     a static file. */
  .iw .alert {
    display: flex;
    align-items: flex-start;
    gap: 7px;
    margin: 8px 0 0;
    padding: 6px 8px;
    background: #fff7ed;
    border-radius: 6px;
    font-size: 11.5px;
    line-height: 1.4;
    color: #7c2d12;
  }
  .iw .alert .sym { font-size: 13px; line-height: 1.2; }
  .iw .alert a { color: #9a3412; font-weight: 600; }
  .iw .from { margin: 6px 0 0; font-size: 11px; color: #6b7280; font-style: italic; }

  .iw .links {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
    margin-top: 9px;
    padding-top: 8px;
    border-top: 1px solid #e5e7eb;
  }
  .iw .links a {
    font-size: 12px;
    color: #1a73e8;
    text-decoration: none;
    font-weight: 500;
  }
  .iw .links a:hover { text-decoration: underline; }

  /* On a phone or tablet the info window is a big share of the screen, so it
     tightens up. Matched on width OR a coarse pointer: an iPad in portrait is
     768px wide and would otherwise take the desktop sizing, and the pointer
     test catches touch devices whatever their width. */
  @media (max-width: 1024px), (pointer: coarse) {
    .iw { min-width: 0; }
    .iw h3 { font-size: 13px; }
    .iw .badges { gap: 4px; margin-bottom: 6px; }
    .iw .badge { font-size: 9.5px; padding: 1px 5px; }
    .iw .addr, .iw .conn { font-size: 11px; }
    .iw .a11y {
      gap: 5px;
      margin-top: 6px;
      padding: 5px 7px;
      font-size: 10.5px;
      line-height: 1.35;
    }
    .iw .a11y .sym { font-size: 13px; }
    .iw .from { margin-top: 5px; font-size: 10px; }
    .iw .links { gap: 3px 10px; margin-top: 7px; padding-top: 6px; }
    .iw .links a { font-size: 11px; }
  }

  /* ---------- Errors / small screens ---------- */

  /* Opaque and on top: when auth fails Google paints its own "Oops!" panel
     into the same element, and two messages layered over each other are
     unreadable. This covers it. */
  #error {
    position: absolute;
    inset: 0;
    z-index: 40;
    display: none;
    overflow-y: auto;
    background: var(--panel);
    padding: 20px;
  }
  #error.on { display: flex; }

  /* margin:auto inside a flex parent centres without clipping the top when the
     message is taller than the box — which it is on a phone. */
  #error .inner {
    margin: auto;
    max-width: 34em;
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.6;
  }

  body.auth-failed #map-controls,
  body.auth-failed #legend { display: none; }
  #error code {
    background: var(--panel-2);
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--text);
  }

  @media (max-width: 760px) {
    /* Phone layout: the map takes a fixed slice of the viewport and the
       sidebar flows underneath, scrolled by the page itself. dvh rather than
       vh so Safari's collapsing address bar doesn't crop it. */
    html, body { height: auto; }

    #app {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto;
      height: auto;
      min-height: 100vh;
      min-height: 100dvh;
    }

    #map-wrap { order: 1; height: 58vh; height: 58dvh; }

    #sidebar {
      order: 2;
      border-right: none;
      border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* One scroller, not two — a nested scroll area inside a scrolling page is
       miserable to use with a thumb. */
    #lines { overflow: visible; flex: none; }

    #legend { display: none; }

    /* With the sidebar folded away there's nothing below the map, so it takes
       the whole viewport rather than leaving dead space under it. */
    body.sidebar-hidden #map-wrap { height: 100vh; height: 100dvh; }

    /* 16px keeps iOS from zooming the whole page when the field takes focus. */
    #search { font-size: 16px; }

    /* Comfortable touch targets. */
    .line-info, #lp-close, #addr-clear { width: 30px; height: 30px; font-size: 15px; }
    #sidebar-open { width: 44px; height: 44px; }
    #sidebar-close { width: 36px; height: 36px; font-size: 20px; }
    .station { padding-top: 9px; padding-bottom: 9px; }
    .near { padding: 9px 4px; }
    #suggest .sug { padding: 11px; }
    #line-panel .lp-stop { padding-top: 8px; padding-bottom: 8px; }

    /* The details popup becomes a bottom sheet rather than a floating card. */
    #line-panel {
      left: 8px; right: 8px;
      top: auto; bottom: 8px;
      width: auto;
      max-height: 72%;
    }
  }

  /* iOS leaves :hover stuck on whatever you tapped last. Drop the highlights
     on touch devices — the hover label itself is gated in JS. */
  @media (hover: none) {
    .line-head:hover,
    .station:hover,
    .near:hover,
    #suggest .sug:hover,
    #line-panel .lp-stop:hover { background: none; }

    .station:hover .a11y { color: var(--faint); }

    .line-info:hover,
    #lp-close:hover,
    #addr-clear:hover { border-color: var(--line); color: var(--muted); }

    .segmented button:not(.active):hover { color: var(--muted); }
  }
</style>

<div id="app">

    <div id="map-corner">

      <div id="legend"></div>

    <div id="error"></div>
  </div>
</div>

/* =========================================================================
   Rapid bus corridors — 8 corridors, 122 km

   Three kinds of source, all from OpenStreetMap, which is why the shapes
   differ in character:

   - Whole bus routes (57, 74), stitched from their route relation's member
     ways in stored order. Order matters: tracing a shortest path between the
     endpoints instead cuts any loop the route makes to serve a station.
   - Transitway proper — segments tagged highway=service with name=Transitway
     and operator=OC Transpo, reduced to one spine per component.
   - Named sections of a single route, sliced out of one direction's relation
     and trimmed at a station: the 61's spur into Terry Fox, the 63 from Moodie
     out to Innovation, the 34 from Chapel Hill to Blair, the 39 from Millennium
     to Blair, the 75 from Baseline to Minto. Take these from ONE direction's
     relation — stitching both gives a doubled path, since the two directions
     use different ways along divided road.

     And check the route goes where you think before drawing it: the 24 looks
     like an Orléans route by name but runs Blair to St-Laurent via Ogilvie,
     5.7 km clear of Chapel Hill. The 34 is the one that serves it.

   All of it then goes through one cleanup pass, in this order — the order is
   the part that's easy to get wrong:

     1. smooth each corridor alone: drop out-and-back excursions under 350 m
        that return within 45 m of where they left, then simplify at 8 m;
     2. THEN snap, most-routes-first, replacing any vertex within 60 m of an
        already-finalised corridor with its projection onto that corridor.

   Snapping before simplifying looks equivalent and isn't: the later simplify
   moves each corridor's vertices independently and pulls the shared stretch
   apart again. Done in this order the overlapping runs share actual vertices,
   so four pairs of corridors that used to draw 0-40 m apart — up to 7.5 km at
   a time, reading as double and triple lines — now draw a mean 2.6-5.9 m apart
   against a 1.6 px stroke, i.e. as one line. 626 vertices down to 425, and no
   corridor more than 45 m off its true alignment.

   Note the tagging: the Transitway is NOT highway=busway. Querying busway in
   an Ottawa bounding box returns Gatineau's Rapibus instead — a different
   agency across the river — which is a convincing-looking wrong answer if you
   don't check where the coordinates land.

   Each entry's `routes` lists the services sharing that corridor, computed by
   intersecting its ways against every OC Transpo bus route relation and
   keeping those covering 90%+ of it. The cutoff matters: without it a route
   that borrows one way of a 99-way corridor is listed as running the whole
   thing. Both new sections show a clean cliff at that line — the 61 spur goes
   94% to 33%, the 63 section 100% to 28%.

   Then sieved against the GTFS feed, keeping only routes that still have trips
   in it. That caught 155, 251, 284 and 167 — routes OSM still carries but
   OC Transpo no longer runs, which were rendering as chips linking to a
   schedule for a route that doesn't exist. Re-run that sieve whenever the
   route lists are regenerated; OSM lags service changes by months.
   ========================================================================= */

let lang = "en";

/* Falls back to English per key, so a missing French string shows English
   prose rather than a bare identifier. Values may be functions when the string
   has to interpolate. */
function t(key, ...args) {
  const v = STRINGS[lang]?.[key] ?? STRINGS.en[key];
  if (v === undefined) return key;
  return typeof v === "function" ? v(...args) : v;
}

function storedLang() {
  try { return localStorage.getItem("otm-lang"); } catch (e) { return null; }
}

/* The reload is the point, not a shortcut: it is the only way to change the
   Maps API's label language, which is read from the loader's `language`
   parameter at script load and has no setter. */
function setLang(next) {
  if (next === lang) return;
  try { localStorage.setItem("otm-lang", next); } catch (e) { /* private mode */ }
  location.reload();
}

/* Display name. `station.name` stays English because it is the identity key
   everywhere else — stationIndex lookups, STATION_ROUTES, the label
   de-duplicator, data-station attributes. */
const lineName = l => (lang === "fr" && l.nameFr) || l.name;

/* Derived from the terminus names rather than read from the `span` field, so
   it follows the display language — "South Keys ↔ Airport" has to become
   "South Keys ↔ Aéroport". `span` stays as the English source of truth for
   the README and anything that wants the canonical form. */
const lineSpan = l => `${stationName(l.stations[0])} ↔ ${stationName(l.stations[l.stations.length - 1])}`;
const stationName = s => (lang === "fr" && s.nameFr) || s.name;
const stationAddr = s => (lang === "fr" && s.addrFr) || s.addr;
const stationConn = s => (lang === "fr" && s.connFr) || s.conn;
const stationAlert = s => (lang === "fr" && s.alertFr) || s.alert;

/* French writes 1,2 km and puts a non-breaking space before the unit. */
function formatNumber(n, decimals = 0) {
  return n.toLocaleString(lang === "fr" ? "fr-CA" : "en-CA",
    { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

/* Accessibility.

   Every open O-Train station is wheelchair accessible, so this is a network-wide fact
   rather than per-station data: OC Transpo builds all stations with level
   boarding (platform flush with the train floor), two elevators between each
   pair of levels for redundancy, tactile wayfinding tiles, and accessible
   fare gates. A station can still opt out with `access: false` — useful if a
   Stage 2 station opens without full provision.

   Deliberately NOT modelled: which stations have escalators (9 of 25 do).
   There's no per-station list published that I could verify, and a wrong
   escalator claim is worse than no claim for someone planning a trip. */
const ACCESS = {
  label: "Wheelchair accessible",
  labelFr: "Accessible en fauteuil roulant",
  detail: "Level boarding · elevators to all platforms",
  detailFr: "Embarquement de plain-pied · ascenseurs vers tous les quais",
  // OC Transpo serves the same page under /en/ and /fr/, so the link follows
  // the reader rather than dumping a francophone onto an English alerts feed.
  alertsUrl: "https://www.octranspo.com/en/alerts/",
  alertsUrlFr: "https://www.octranspo.com/fr/alertes/"
};

const accessLabel = () => (lang === "fr" && ACCESS.labelFr) || ACCESS.label;
const accessDetail = () => (lang === "fr" && ACCESS.detailFr) || ACCESS.detail;
const alertsUrl = () => (lang === "fr" && ACCESS.alertsUrlFr) || ACCESS.alertsUrl;

const isAccessible = station => station.access !== false;

/* =========================================================================
   Basemap style

   The basemap is scenery, not the subject: near-black geometry, dim label
   text, and no pictograms at all — `labels.icon: off` is what removes the
   highway shields and POI markers, which were the loudest things competing
   with the routes.

   Label *density* isn't exposed by the Maps API — there's no "space these out"
   knob. What is possible is varying the style by zoom, which is the practical
   equivalent: zoomed out, only arterials and highways are named; from zoom 14
   every street carries its name. Nothing is permanently unlabelled, you just
   see fewer names at once.
   ========================================================================= */

const LABEL_ZOOM = 14;          // local street names appear at or above this

/* A touch device fires mouseover on tap and never fires mouseout, so a hover
   label would appear and then stay stuck over the map. Tapping a station opens
   its info window anyway, which says everything the label does and more. */
const CAN_HOVER = window.matchMedia("(hover: hover)").matches;

/* Station dots and the white tunnel dashes both sit on top of the routes, so
   they come off together when zooming out. 12 is as low as this can go: the
   tightest pair on the network (Lyon–Parliament, 484 m) is 18 px apart there
   against ~11 px dots, leaving a clear gap. By 11.5 that gap is 2 px and the
   dots merge into a blob over the line. */
const DETAIL_MIN_ZOOM = 12;

/* Both themes want the same map: quiet ground, recessive roads, no pictograms,
   nothing competing with the routes. Only the colours differ, so the style is
   generated from a palette rather than written out twice — a rule added here
   applies to both themes automatically. */
const PALETTES = {
  dark: {
    canvas: "#0d1017", halo: "#0d1017", labelText: "#596373",
    park: "#101a15", water: "#0a1119", waterLabel: "#3d4959",
    road: "#161a22", arterial: "#1b2029", highway: "#212734",
    roadLabel: "#525c6b", highwayLabel: "#626d7e",
    // Over imagery the palette flips: legible roads, white text, dark wash.
    // scrimOpacity is how far the photo gets knocked back — raise for dimmer.
    // These road greys are pre-wash: the scrim sits above the basemap, so it
    // darkens them too. Near-neutral and barely separated from each other, so
    // the roads sit down into the dimmed photo instead of reading as a second
    // network competing with the routes.
    imgRoad: "#565c64", imgArterial: "#5d646c", imgHighway: "#666e77",
    imgLabel: "#ffffff", imgHalo: "#000000", imgWaterLabel: "#d3e6ff",
    scrim: "#080b11", scrimOpacity: 0.42,
    dotFill: "#ffffff", dotRing: "#ffffff", accent: "#4a9eff",
    transitway: "#6274c4"
  },
  light: {
    canvas: "#eef1f5", halo: "#ffffff", labelText: "#8a94a5",
    park: "#e3ece3", water: "#d8e4f0", waterLabel: "#8ba0b8",
    road: "#ffffff", arterial: "#ffffff", highway: "#fbfcfd",
    roadLabel: "#94a0b0", highwayLabel: "#7f8b9c",
    // A white wash leaves a pale photo, so imagery labels and roads go dark.
    imgRoad: "#5a6675", imgArterial: "#4a5665", imgHighway: "#3b4757",
    imgLabel: "#1e2733", imgHalo: "#ffffff", imgWaterLabel: "#2f5378",
    scrim: "#ffffff", scrimOpacity: 0.38,
    dotFill: "#ffffff", dotRing: "#ffffff", accent: "#1a73e8",
    transitway: "#9fb2d9"
  }
};

let theme = "light";
const palette = () => PALETTES[theme];

function buildBaseStyle(p) {
  return [
    { elementType: "geometry", stylers: [{ color: p.canvas }] },
    { elementType: "labels.text.fill", stylers: [{ color: p.labelText }] },
    { elementType: "labels.text.stroke", stylers: [{ color: p.halo }, { weight: 2 }] },

    // Every pictogram: highway shields, POI icons, park markers.
    { elementType: "labels.icon", stylers: [{ visibility: "off" }] },

    // POI names are pure clutter here; parks stay as faint shape only.
    { featureType: "poi", stylers: [{ visibility: "off" }] },
    { featureType: "poi.park", elementType: "geometry",
      stylers: [{ visibility: "on" }, { color: p.park }] },

    // Roads present but recessive, arterials a shade apart from locals.
    { featureType: "road", elementType: "geometry", stylers: [{ color: p.road }] },
    { featureType: "road.arterial", elementType: "geometry", stylers: [{ color: p.arterial }] },
    { featureType: "road.highway", elementType: "geometry", stylers: [{ color: p.highway }] },
    { featureType: "road", elementType: "labels.text.fill", stylers: [{ color: p.roadLabel }] },
    { featureType: "road.highway", elementType: "labels.text.fill", stylers: [{ color: p.highwayLabel }] },

    // We draw the transit network ourselves; Google's would double up.
    { featureType: "transit", stylers: [{ visibility: "off" }] },

    { featureType: "water", elementType: "geometry", stylers: [{ color: p.water }] },
    { featureType: "water", elementType: "labels.text.fill", stylers: [{ color: p.waterLabel }] },

    // Boundaries and place names both off. The neighbourhood captions —
    // GREENBORO, BLOSSOM PARK, WINDSOR PARK VILLAGE — sat right on top of our
    // station labels, and naming the city adds nothing to a map that never
    // leaves it. Blanket rules rather than per-sublevel ones, because the
    // narrower administrative.neighborhood rule this replaces wasn't taking
    // effect: the captions were still drawn.
    { featureType: "administrative", elementType: "geometry", stylers: [{ visibility: "off" }] },
    { featureType: "administrative", elementType: "labels", stylers: [{ visibility: "off" }] }
  ];
}

const SPARSE_LABELS = [
  { featureType: "road.local", elementType: "labels", stylers: [{ visibility: "off" }] }
];

/* The base style is tuned for a flat coloured ground, and all of it applies
   over satellite too — which inverts the intent in both themes. Dark mode's
   near-black roads become black lines across the photo; light mode's white
   roads vanish into the white wash. So the imagery palette is separate, and
   whichever wash is in play, roads and labels swing the other way.

   Appended last so it wins, and it restates the specific road rules rather
   than relying on a blanket rule to override the narrower ones set earlier. */
function buildImageryOverrides(p) {
  return [
    { featureType: "road", elementType: "geometry", stylers: [{ color: p.imgRoad }] },
    { featureType: "road.arterial", elementType: "geometry", stylers: [{ color: p.imgArterial }] },
    { featureType: "road.highway", elementType: "geometry", stylers: [{ color: p.imgHighway }] },

    // Drop the casing that outlines every road. There's no width styler in the
    // Maps API, and losing the outline is the one thing that genuinely makes a
    // road render thinner rather than merely dimmer.
    { featureType: "road", elementType: "geometry.stroke", stylers: [{ visibility: "off" }] },

    // Flat fills of either theme would blot out the photograph.
    { featureType: "poi.park", elementType: "geometry", stylers: [{ visibility: "off" }] },
    { featureType: "water", elementType: "geometry", stylers: [{ visibility: "off" }] },

    { elementType: "labels.text.fill", stylers: [{ color: p.imgLabel }] },
    { elementType: "labels.text.stroke", stylers: [{ color: p.imgHalo }, { weight: 3 }] },
    { featureType: "road", elementType: "labels.text.fill", stylers: [{ color: p.imgLabel }] },
    { featureType: "road.highway", elementType: "labels.text.fill", stylers: [{ color: p.imgLabel }] },
    { featureType: "water", elementType: "labels.text.fill", stylers: [{ color: p.imgWaterLabel }] }
  ];
}

/* =========================================================================
   Map rendering
   ========================================================================= */

let map, infoWindow, stationLabels, imageryScrim;
let labelTier = null;   // remembers which style is applied, to avoid churn

const layers = {};       // lineId -> { route, tunnels, path, visible }
const futureShapes = []; // Stage 2 polylines and markers, toggled as one
const futureLabels = []; // their names, drawn by the same overlay as the rest
let futureVisible = false;

const transitwayShapes = [];   // BRT corridors, drawn under the rail
const transitLabels = [];      // their station names, in the shared overlay
let transitwayVisible = true;
const stationIndex = []; // flat list for search: { line, station, marker }

function initMap() {
  // No mapId here on purpose: a map ID routes styling through the cloud
  // console and makes the `styles` array below a no-op.
  map = new google.maps.Map(document.getElementById("map"), {
    center: DEFAULT_VIEW.center,
    zoom: DEFAULT_VIEW.zoom,
    mapTypeControl: false,
    streetViewControl: true,
    fullscreenControl: false,
    zoomControl: true,
    // "auto" makes a phone demand two fingers to pan, which fights the user on
    // a page whose whole point is the map.
    gestureHandling: "greedy"
  });

  infoWindow = new google.maps.InfoWindow({ maxWidth: infoWindowWidth() });

  /* Imagery can't be styled — no featureType covers the photo itself — so the
     only way to calm it is to lay something over it. A world-sized translucent
     rectangle at zIndex 1 sits above the tiles but beneath the routes (zIndex
     2) and dashes (3), so the photo dims and the network doesn't. Dimming the
     whole map element with a CSS filter would have taken the routes down with
     it and gained nothing. Not clickable, so taps still reach the map.

     Built before the first applyStyles(), which recolours it per theme. */
  imageryScrim = new google.maps.Rectangle({
    bounds: { north: 85, south: -85, east: 180, west: -180 },
    strokeOpacity: 0,
    clickable: false,
    zIndex: 1,
    map: null                      // switched on only for imagery
  });

  labelTier = DEFAULT_VIEW.zoom >= LABEL_ZOOM ? "full" : "sparse";
  applyStyles();

  NETWORK.forEach(drawLine);
  drawTransitway();
  drawFuture();               // built hidden; the sidebar card switches it on
  initStationLabels();        // needs the stationIndex that drawLine fills
  buildSidebar();
  initSearch();
  // Runs again from the label overlay's onAdd(), which is where the entries
  // gain the labelZoom this depends on.
  updateDetailVisibility();

  document.getElementById("basemap").addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (btn) setBasemap(btn.dataset.type);
  });

  document.getElementById("theme").addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (btn) setTheme(btn.dataset.theme);
  });

  // Escape backs out of one thing at a time: suggestions first (handled on the
  // input itself), then the line popup.
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && suggestEl.hidden) closeLinePanel();
  });

  map.addListener("zoom_changed", () => {
    updateDetailVisibility();
    applyLabelTier();
  });

  /* Street View takes over the same element, and none of the map's furniture
     applies to a panorama — the basemap and theme switches do nothing there,
     and the legend describes lines you can't see. Stand them down while it's
     up. The routes need no handling: overlays are map-only and never render
     in a panorama. */
  map.getStreetView().addListener("visible_changed", () => {
    const inPanorama = map.getStreetView().getVisible();
    document.body.classList.toggle("streetview", inPanorama);
    if (inPanorama) closeLinePanel();
  });

  // Clicking away dismisses the popup and brings the other lines back.
  // Overlays swallow their own clicks, so this only fires on bare basemap.
  map.addListener("click", dismissLinePanel);

  // pointerdown rather than click: Safari on iOS is unreliable about bubbling
  // taps on non-interactive elements up to a document-level click listener.
  document.addEventListener("pointerdown", e => {
    if (e.target.closest("#line-panel")) return;   // interacting with the popup
    if (e.target.closest(".line-info")) return;    // switching to another line
    if (e.target.closest("#map")) return;          // handled by the map listener
    dismissLinePanel();
  });
}

/* The click that opens the popup also bubbles onward; ignore dismissals that
   land in the same instant so the popup can't close itself on open. */
function dismissLinePanel() {
  if (performance.now() - openedAt < 150) return;
  closeLinePanel();
}

/* Switch the base map style. "hybrid" is satellite imagery with road and
   place labels kept on top; plain "satellite" would drop them. */
function setBasemap(type) {
  map.setMapTypeId(type);

  document.querySelectorAll("#basemap button").forEach(b =>
    b.classList.toggle("active", b.dataset.type === type)
  );

  // Imagery is busy and mid-toned, so routes and station dots both need a
  // little more weight to hold their own against it.
  const onImagery = type === "hybrid" || type === "satellite";
  document.body.classList.toggle("imagery", onImagery);
  applyStyles();   // reads the class just set, so ordering matters here
  imageryScrim.setMap(onImagery ? map : null);

  Object.values(layers).forEach(layer =>
    layer.route.setOptions({ strokeWeight: routeWeight(false) })
  );
  // The corridors thicken over imagery too, and by the same reasoning — but
  // they carry their own scale, so they need their own pass.
  transitwayShapes.forEach(s => {
    if (!s.setIcon) s.setOptions({ strokeWeight: corridorWeight(false) });
  });
  refreshStationIcons();
}

/* The style is composed from the base plus whichever modifiers apply: label
   thinning when zoomed out, light label text over imagery. */
function applyStyles() {
  const p = palette();
  const onImagery = document.body.classList.contains("imagery");
  map.setOptions({
    styles: buildBaseStyle(p)
      .concat(labelTier === "sparse" ? SPARSE_LABELS : [])
      .concat(onImagery ? buildImageryOverrides(p) : [])
  });
  imageryScrim.setOptions({ fillColor: p.scrim, fillOpacity: p.scrimOpacity });
}

/* Switching theme restyles the basemap, recolours the vector markers (they're
   drawn by the Maps API, so no CSS reaches them), and repaints the DOM through
   the token block. Stored so the choice survives a reload. */
function setTheme(name) {
  theme = PALETTES[name] ? name : "light";
  document.documentElement.classList.toggle("dark", theme === "dark");

  document.querySelectorAll("#theme button").forEach(b =>
    b.classList.toggle("active", b.dataset.theme === theme)
  );

  try { localStorage.setItem("otm-theme", theme); } catch (e) { /* private mode */ }

  if (!map) return;              // called once before the map exists
  applyStyles();
  refreshStationIcons();
  refreshTransitwayColour();
  if (addrMarker) addrMarker.setIcon(addressIcon());
}

function storedTheme() {
  try { return localStorage.getItem("otm-theme"); } catch (e) { return null; }
}

/* The sidebar is the widest piece of furniture on the page, so the hamburger
   folds it away when the map is what you want. Hidden state is the class, not
   shown — the default is open, and a default that needs no class can't flash
   the wrong way before the script runs. */
function setSidebarOpen(open) {
  document.body.classList.toggle("sidebar-hidden", !open);
  document.getElementById("sidebar-open").setAttribute("aria-expanded", String(open));
  try { localStorage.setItem("otm-sidebar", open ? "1" : "0"); } catch (e) { /* private mode */ }
}

/* Everything on the page that isn't rendered by a later function: the header,
   the search field, the footer, the three segmented controls, the legend.

   Runs at parse time alongside setTheme, so the page is never briefly English
   before turning French. The legend's line rows are built from NETWORK rather
   than written out in markup — a second hand-kept copy of the line names is
   exactly the thing that drifts in one language and not the other. */
function applyLanguage() {
  document.documentElement.lang = lang;
  document.title = lang === "fr"
    ? "Transport rapide d'Ottawa — carte du train et des autobus"

  const set = (id, html) => {
    const el = document.getElementById(id);

  };

  set("brand-tagline", t("tagline"));

  attr("#sidebar-close", "aria-label", t("hideSidebar"));
  attr("#sidebar-open", "title", t("showSidebar"));

  attr("#search", "placeholder", t("searchPlaceholder"));
  attr("#suggest", "aria-label", t("suggestions"));
  attr("#basemap", "aria-label", t("basemapGroup"));
  attr("#theme", "aria-label", t("themeGroup"));
  attr("#lang", "aria-label", t("langGroup"));
  attr("#compass", "aria-label", t("northIsUp"));
  attr("#line-panel", "aria-label", t("lineDetails"));

  const [mapBtn, satBtn] = document.querySelectorAll("#basemap button");
  if (mapBtn) mapBtn.textContent = t("map");
  if (satBtn) satBtn.textContent = t("satellite");
  const [lightBtn, darkBtn] = document.querySelectorAll("#theme button");
  if (lightBtn) lightBtn.textContent = t("light");
  if (darkBtn) darkBtn.textContent = t("dark");

  document.querySelectorAll("#lang button").forEach(b =>
    b.classList.toggle("active", b.dataset.lang === lang));

    ? "https://www.octranspo.com/fr/planifiez-votre-trajet/outils-de-voyage/developpeurs/"
    : "https://www.octranspo.com/en/plan-your-trip/travel-tools/developers/";
  set("site-footer", `
    ${t("footerHelp")}
    ${t("footerAlignment")} &copy;
    <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>
    ${t("footerContributors")}
    ${t("footerRoutes")}
    <a href="${dev}" target="_blank" rel="noopener">OC Transpo</a>.
  `);

  set("legend", `
    <div class="title">${t("legend")}</div>
    ${NETWORK.map(l => `<div class="row"><span class="bar" style="background:${l.color}"></span> ${escapeHtml(lineName(l))}</div>`).join("")}
    <div class="row"><span class="dashed"></span> ${t("undergroundSection")}</div>
    <div class="row"><span class="bar transitway-bar"></span> ${t("rapidBusRoute")}</div>
    <div class="row"><span class="bar under-construction"></span> ${t("underConstruction")}</div>
    <div class="row"><span class="sym" role="img" aria-label="${escapeHtml(accessLabel())}">&#9855;&#xFE0E;</span> ${t("accessibleAll")}</div>
  `);

  document.getElementById("lang").addEventListener("click", e => {
